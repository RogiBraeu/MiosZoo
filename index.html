/* ---------- Lektion abspielen ---------- */
const Lesson = {
  plan: null, root: null, queue: [], idx: 0, opts: null, st: null,

  start(plan, opts) {
    this.plan = plan; this.opts = opts || {};
    // XP pro Lektion einstellbar (z. B. weniger XP für Übungen am Gehege)
    this.xp = Object.assign({ correct: CONFIG.XP_CORRECT, retry: CONFIG.XP_RETRY, lesson: CONFIG.XP_LESSON, combo: CONFIG.XP_COMBO }, this.opts.xp || {});
    this.queue = plan.items.slice(); this.idx = 0;
    this.st = { xp: 0, combo: 0, correctFirst: 0, answered: 0, mOk: {}, sOk: {}, mistakes: {}, attempts: {},
      usedTypes: {}, usedSentences: {}, endRetry: {}, learnedNow: [], reviewed: new Map(), firstDone: {} };
    Store.data.lastPlayDay = U.today(); Store.save();
    this.root = document.getElementById("lesson");
    this.root.innerHTML = `
      <div class="ls-top">
        <button class="ls-close" aria-label="Lektion beenden">✕</button>
        <div class="ls-bar"><div class="ls-fill"></div></div>
        <div class="ls-xp">⭐ <span>0</span></div>
      </div>
      <div class="ls-body"></div>
      <div class="ls-foot"></div>
      <div class="ls-sheet" hidden></div>
      <div class="ls-dialog" hidden></div>`;
    this.root.hidden = false;
    document.body.classList.add("in-lesson");
    this.root.querySelector(".ls-close").onclick = () => this.askQuit();
    this.render();
  },

  askQuit() {
    const d = this.root.querySelector(".ls-dialog");
    d.hidden = false;
    d.innerHTML = `<div class="dlg-box">${Mio.svg("encourage")}
      <p class="dlg-title">Wirklich aufhören?</p>
      <p>${this.st.xp > 0 ? `Die <b>${this.st.xp} XP</b> aus dieser Runde gibt es nur, wenn du sie fertig machst. Hörst du jetzt auf, sind sie weg.` : "XP gibt es nur, wenn du die Runde fertig machst."}</p>
      <p class="small">Was du schon gelernt hast, bleibt gelernt.</p>
      <button class="btn primary big" data-a="stay">Weiterlernen</button>
      <button class="btn ghost" data-a="quit">Aufhören</button></div>`;
    d.querySelector('[data-a="stay"]').onclick = () => { d.hidden = true; };
    d.querySelector('[data-a="quit"]').onclick = () => this.close(false);
  },

  close(completed) {
    try { if (Speech.ok) speechSynthesis.cancel(); } catch (e) {}
    if (!completed) this.st.xp = 0;                                     // abgebrochen: keine XP
    this.root.hidden = true; this.root.innerHTML = "";
    document.body.classList.remove("in-lesson");
    const res = { completed, xp: this.st.xp, plan: this.plan, learned: this.st.learnedNow, reviewed: [...this.st.reviewed.keys()],
      mistakes: this.st.answered - this.st.correctFirst };
    if (this.opts.onClose) this.opts.onClose(res);
  },

  progress() {
    const total = this.queue.length, done = this.idx;
    this.root.querySelector(".ls-fill").style.width = Math.round(100 * done / Math.max(1, total)) + "%";
    this.root.querySelector(".ls-xp span").textContent = this.st.xp;
  },

  render() {
    this.progress();
    const sheet = this.root.querySelector(".ls-sheet"); sheet.hidden = true; sheet.className = "ls-sheet";
    if (this.idx >= this.queue.length) return this.finish();
    const item = this.queue[this.idx];
    const body = this.root.querySelector(".ls-body"), foot = this.root.querySelector(".ls-foot");
    body.scrollTop = 0; foot.innerHTML = "";
    if (item.kind === "intro") return this.renderIntro(item, body, foot);
    if (item.kind === "match") return Ex.match(item, body, foot);
    const type = Ex.chooseType(item);
    item.type = type;
    Ex[type](item, body, foot);
  },

  badges(item) {
    let b = "";
    if (item.retry) b += `<span class="badge retry">💪 ${U.esc(item.retryMsg || (item.retryMsg = U.pick(Mio.retry)))}</span>`;
    else if (item.review && item.w && Plan.isDueNow(item.w, item.part)) b += `<span class="badge review">🔁 Wiederholung</span>`;
    else if (item.review) b += `<span class="badge extra">🎯 Extra-Übung</span>`;
    else if (item.isNew && item.part === "s") b += `<span class="badge spell">✏️ Rechtschreibung</span>`;
    return b ? `<div class="badges">${b}</div>` : "";
  },

  renderIntro(item, body, foot) {
    const w = item.w;
    if (!item.again) Plan.markSeen(w);
    const tricky = U.trickySet(w);
    const exIn = Data.sentencesWith(w)[0], ex = exIn || w.ex[0];
    const badge = `<div class="badges">${item.again ? `<span class="badge retry">👀 Schau noch einmal genau hin</span>` : `<span class="badge new">✨ Neues Wort</span>`}</div>`;
    if (exIn) {
      // Wort im Satz: der Satz steht groß oben und wird gleich vorgelesen, das einzelne Wort steht klein darunter
      body.innerHTML = badge + `
      <div class="intro-card">
        <div class="intro-sent">${Ex.under(w, ex.en)} ${Speech.btn(ex.en)}</div>
        ${ex.de ? `<div class="intro-sent-de">${U.esc(ex.de)}</div>` : ""}
        <div class="intro-small">
          <div class="intro-word small"><span>${U.letters(w.en, tricky, "tricky")}</span> ${Speech.btn(w.say, "small")}</div>
          <div class="intro-de small">${U.esc(w.de)}</div>
          ${tricky.size ? `<div class="intro-tip">Achtung bei den <span class="tricky">farbigen</span> Buchstaben!</div>` : ""}
          ${w.hint ? `<div class="hint">💡 ${U.esc(w.hint)}</div>` : ""}
        </div>
      </div>`;
      Ex.bindSay(body);
      foot.innerHTML = `<button class="btn primary big" data-next>Weiter</button>`;
      foot.querySelector("[data-next]").onclick = () => { Sound.play("tap"); this.idx++; this.render(); };
      Speech.say(ex.en);
      return;
    }
    body.innerHTML = badge + `
      <div class="intro-card">
        <div class="intro-word"><span>${U.letters(w.en, tricky, "tricky")}</span> ${Speech.btn(w.say)}</div>
        <div class="intro-de">${U.esc(w.de)}</div>
        ${tricky.size ? `<div class="intro-tip">Achtung bei den <span class="tricky">farbigen</span> Buchstaben!</div>` : ""}
        ${w.hint ? `<div class="hint">💡 ${U.esc(w.hint)}</div>` : ""}
        ${ex ? `<div class="intro-ex"><div class="ex-en">${Ex.under(w, ex.en)} ${Speech.btn(ex.en, "small")}</div><div class="ex-de">${U.esc(ex.de || "")}</div></div>` : ""}
      </div>`;
    Ex.bindSay(body);
    foot.innerHTML = `<button class="btn primary big" data-next>Weiter</button>`;
    foot.querySelector("[data-next]").onclick = () => { Sound.play("tap"); this.idx++; this.render(); };
    Speech.say(w.say);
  },

  /* Antwort auswerten */
  answer(item, ok, info) {
    info = info || {};
    const st = this.st, w = item.w;
    const key = item.kind === "match" ? "match" + this.idx : w.id + item.part;
    st.answered++;
    if (ok) {
      const first = !item.retry;
      const gain = first ? this.xp.correct : this.xp.retry;
      st.xp += gain;                                                     // gutgeschrieben wird erst am Ende (Abbrechen = keine XP)
      if (first) st.correctFirst++;
      st.combo++;
    } else {
      st.combo = 0;
    }
    if (item.kind === "task") {
      st.usedTypes[w.id + item.part] = (st.usedTypes[w.id + item.part] || []).concat(item.type);
      // Wiederholungswort: nur die erste Antwort (pro Wort und Teil) zählt für die Stufe – auch in der Fehlerrunde
      if (item.review && !st.firstDone[w.id + item.part]) {
        st.firstDone[w.id + item.part] = true;
        const r = Plan.reviewResult(w, ok, item.part, item.type);
        if (r.counted) { info.stage = Object.assign({ part: item.part }, r); if (ok && r.to > r.from) st.stageUps = (st.stageUps || 0) + 1; if (r.sits) st.sitsNow = (st.sitsNow || 0) + 1; }
        st.reviewed.set(w.id, ok);
      }
      if (!ok) {
        st.mistakes[w.id] = (st.mistakes[w.id] || 0) + 1;
        this.scheduleRetry(item);
      } else {
        if (item.retry) this.dropCloseRetry(item);
        if (item.part === "m") st.mOk[w.id] = true; else st.sOk[w.id] = true;
        // Neues Wort: erst gelernt, wenn Bedeutung UND Schreibweise geklappt haben
        if ((item.isNew || item.wasNew) && st.mOk[w.id] && st.sOk[w.id] && !Plan.isLearned(w)) {
          Plan.newLearned(w, st.mistakes[w.id] || 0);
          st.learnedNow.push(w.id);
          info.stage = { counted: true, from: 0, to: 1, part: "new" };
        }
      }
    }
    this.feedback(item, ok, info);
  },

  /* Falsches Wort neu einplanen: einmal nach ein paar Aufgaben und einmal am Ende –
     nie mehrfach direkt hintereinander */
  scheduleRetry(item) {
    const st = this.st, id = item.w.id, part = item.part, k = id + part;
    st.attempts[k] = (st.attempts[k] || 0) + 1;
    const same = q => q.kind !== "intro" && q.retry && q.w && q.w.id === id && q.part === part;
    // alte, noch offene Wiederholungen dieses Worts entfernen und neu planen
    this.queue = this.queue.filter((q, i) => i <= this.idx || !(same(q) || (q.again && q.w.id === id)));
    const base = { kind: "task", w: item.w, part, retry: true, review: item.review, wasNew: item.isNew || item.wasNew };
    const card = { kind: "intro", w: item.w, again: true };
    const help = st.attempts[k] >= 2; // nach zwei Fehlern: erst noch einmal die Lernkarte zeigen
    const others = this.queue.length - (this.idx + 1);
    if (others >= 3) {
      const pos = this.idx + 4;
      this.queue.splice(pos, 0, ...(help ? [card, Object.assign({}, base)] : [Object.assign({}, base)]));
      // noch einmal am Ende – aber nur, wenn genug andere Aufgaben dazwischen liegen
      if (this.queue.length - (pos + (help ? 2 : 1)) >= 2) this.queue.push(Object.assign({}, base, { endRetry: true }));
    } else {
      // kurz vor Schluss: ein, zwei andere Wörter dazwischenschieben, damit es nicht direkt wiederkommt
      const done = new Set(), fill = [];
      this.queue.slice(0, this.idx).forEach(q => { if (q.kind === "task" && q.w && q.w.id !== id && !done.has(q.w.id)) { done.add(q.w.id); fill.push(q.w); } });
      U.shuffle(fill).slice(0, Math.max(0, 2 - others)).forEach(w =>
        this.queue.push({ kind: "task", w, part: "m", review: true, easy: true, filler: true }));
      if (help) this.queue.push(card);
      this.queue.push(Object.assign({}, base, { endRetry: true }));
    }
  },

  /* nach richtiger Wiederholung: Abschluss-Wiederholung streichen, wenn sie direkt folgen würde */
  dropCloseRetry(item) {
    const id = item.w.id, part = item.part;
    const j = this.queue.findIndex((q, i) => i > this.idx && q.retry && q.w && q.w.id === id && q.part === part);
    if (j >= 0 && j - this.idx <= 2) this.queue.splice(j, 1);
  },

  feedback(item, ok, info) {
    const st = this.st;
    const sheet = this.root.querySelector(".ls-sheet");
    const foot = this.root.querySelector(".ls-foot");
    foot.innerHTML = "";
    let combo = ok && st.combo > 0 && st.combo % CONFIG.COMBO === 0;
    if (combo && this.xp.combo) st.xp += this.xp.combo;
    this.progress();
    let title, text = "";
    if (ok) {
      title = combo ? `🔥 ${st.combo} in a row! ${U.pick(Mio.combo)}` : (info.near ? "Almost perfect!" : U.pick(Mio.praise));
      if (info.near) text = `Fast richtig – zählt! So schreibt man es: <b>${U.esc(info.correct)}</b>`;
      else if (info.correctHtml) text = info.correctHtml;
      const g = item.retry ? this.xp.retry : this.xp.correct;
      if (!info.noGain && g > 0) text += `<div class="gain">+${g} XP${combo && this.xp.combo ? ` &nbsp;+${this.xp.combo} Bonus` : ""}</div>`;
      text += Lesson.stageNote(info.stage);
      Sound.play(combo ? "combo" : "correct");
      // Jubel abwechselnd: Konfetti, Herzen, Sterne, Feuerwerk, Luftballons
      const fx = Confetti.pick();
      Confetti.burst(combo ? 140 : (fx === "fireworks" ? 90 : 45), fx);
      if (combo && fx !== "fireworks") Confetti.burst(80, "fireworks");
      if (info.stage && info.stage.sits) { Confetti.burst(120, "stars"); Sound.play("combo"); }
    } else {
      title = info.spell ? "Fast! Schau dir die Stelle genau an." : U.pick(Mio.cheerUp);
      text = info.html || (info.correct ? `Richtig ist: <b>${U.esc(info.correct)}</b>` : "");
      if (item.w && item.w.hint) text += `<div class="hint">💡 ${U.esc(item.w.hint)}</div>`;
      text += `<div class="again">Kein Problem – das kommt gleich noch einmal.${info.stage && info.stage.counted ? " Und morgen üben wir es noch mal." : ""}</div>`;
      Sound.play("wrong");
    }
    // Wort im Zusammenhang: nach jeder Aufgabe ohne Satz kommt der Beispielsatz dazu (Wort unterstrichen) und wird vorgelesen
    const exS = item.kind === "task" && item.w && !info.sentShown ? Ex.exampleFor(item) : null;
    if (exS) text = Ex.exampleBox(item.w, exS, "in-sheet") + text;
    sheet.className = "ls-sheet " + (ok ? "ok" : "bad");
    sheet.innerHTML = `<div class="sheet-row"><div class="sheet-mio">${Mio.svg(ok ? (combo ? "party" : "cheer") : "encourage")}</div>
      <div class="sheet-txt"><div class="sheet-title">${title}</div><div class="sheet-detail">${text}</div></div></div>
      <button class="btn big ${ok ? "primary" : "warm"}" data-next>Weiter</button>`;
    sheet.hidden = false;
    sheet.querySelectorAll("[data-say]").forEach(b => b.onclick = () => Speech.say(b.dataset.say));
    const next = sheet.querySelector("[data-next]");
    next.onclick = () => { Sound.play("tap"); this.idx++; this.render(); };
    next.focus({ preventScroll: true });
    if (exS) Speech.say(exS.en);
    else if (info.sayAfter) Speech.say(info.sayAfter);
  },

  /* kleine Zeile unter dem Lob: Stufe gestiegen / neues Wort / sitzt! */
  stageNote(sg) {
    if (!sg || !sg.counted || sg.to <= sg.from) return "";
    const S = STAGES[sg.to], dot = `<span class="st-dot" style="background:${S.col}"></span>`;
    if (sg.part === "new") return `<div class="stage-note">🌱 Neues Wort · Stufe 1 · ${S.de}</div>`;
    const what = sg.part === "s" ? (sg.alsoM && sg.alsoM.to > sg.alsoM.from ? "✏️ Schreiben + 📖 Bedeutung" : "✏️ Schreiben") : "📖 Bedeutung";
    if (sg.sits) return `<div class="stage-note sits">🏅 Das Wort sitzt! <em>Nailed it!</em></div>`;
    return `<div class="stage-note">${dot} ${what}: Stufe ${sg.from} → ${sg.to} · ${S.de}</div>`;
  },

  finish() {
    const st = this.st;
    if (this.xp.lesson) st.xp += this.xp.lesson;
    // Alle XP der Einheit kommen erst jetzt aufs Konto – wer abbricht, bekommt keine (sonst könnte man Anfänge immer wieder „farmen“)
    if (st.xp > 0) Plan.addXP(st.xp);
    Plan.lessonFinished();
    if (this.plan.kind === "new") {
      const pack = Plan.packs(this.plan.setId)[this.plan.packIndex];
      if (pack && pack.done) { const t = U.today(); Store.data.packsDone[t] = (Store.data.packsDone[t] || 0) + 1; Store.save(); }
    }
    Sound.play("finish"); Confetti.burst(160); Confetti.burst(140, "fireworks");
    const body = this.root.querySelector(".ls-body"), foot = this.root.querySelector(".ls-foot");
    this.root.querySelector(".ls-fill").style.width = "100%";
    const acc = st.answered ? Math.round(100 * st.correctFirst / Math.max(1, st.answered)) : 100;
    const refreshed = [...st.reviewed.keys()].map(id => Data.byId[id]);
    body.innerHTML = `<div class="finish">
      <div class="finish-mio">${Mio.svg("party")}</div>
      <h2>${U.esc(this.opts.finishTitle || "Lesson complete!")}</h2>
      <div class="stats">
        <div class="stat"><b>+${st.xp}</b><span>XP</span></div>
        <div class="stat"><b>${Plan.streak()}</b><span>🔥 Tage</span></div>
        <div class="stat"><b>${st.learnedNow.length}</b><span>neue Wörter</span></div>
      </div>
      ${st.stageUps ? `<div class="stage-sum">⭐ ${st.stageUps} ${st.stageUps === 1 ? "Stufe" : "Stufen"} höher${st.sitsNow ? ` · 🏅 ${st.sitsNow} ${st.sitsNow === 1 ? "Wort sitzt" : "Wörter sitzen"} jetzt` : ""}</div>` : ""}
      ${refreshed.length ? `<div class="refreshed"><div class="ref-title">Wörter, die wir heute aufgefrischt haben:</div>
        <div class="chips">${refreshed.map(w => `<span class="chip">${U.esc(w.en)}</span>`).join("")}</div></div>` : ""}
      ${this.opts.finishExtra ? this.opts.finishExtra(st) : ""}
    </div>`;
    foot.innerHTML = `<button class="btn primary big" data-done>Fertig</button>`;
    foot.querySelector("[data-done]").onclick = () => this.close(true);
  }
};

/* ---------- Übungsarten ---------- */
const Ex = {
  chooseType(item) {
    const w = item.w, st = Lesson.st;
    const k = w.id + item.part;
    const used = st.usedTypes[k] || [];
    const attempts = st.attempts[k] || 0;
    if (item.part === "s") {
      let lvl = Plan.spellLevel(w, item.isNew || item.wasNew);
      if (attempts >= 2) lvl = 1;
      if (lvl === 3 && !(Speech.ok && Store.data.settings.speech)) lvl = 2;
      if (lvl === 2 && item.retry && used.includes("spell_gap") && attempts >= 1) lvl = 1;
      if (w.sp) return ["spell_tiles", "spell_gap", "spell_listen"][lvl - 1];
    }
    const hasS = Data.sentencesWith(w).length > 0;
    const hasDeS = w.ex.some(e => e.de && e.en.split(" ").length <= 9);
    let c;
    if (item.easy) c = ["mc_en_de", "mc_de_en"];
    else if (item.isNew) c = ["mc_en_de", "mc_de_en", hasS && "cloze_mc", hasS && "context", hasDeS && "sentence_tiles"];
    else c = ["mc_en_de", "mc_de_en", "translate_type", hasS && "cloze_mc", hasS && "context", hasDeS && "sentence_tiles"];
    c = c.filter(Boolean);
    if (attempts >= 2) c = c.filter(t => t.startsWith("mc_") || t === "cloze_mc" || t === "context");
    const count = t => used.filter(x => x === t).length;
    const min = Math.min(...c.map(count));
    let pool = c.filter(t => count(t) === min);
    if (pool.length > 1) pool = pool.filter(t => t !== used[used.length - 1]);
    return U.pick(pool);
  },

  head(item, instr) {
    return Lesson.badges(item) + `<div class="instr">${instr}</div>`;
  },

  distractors(w, field, n) {
    const val = x => String(x[field] || x.en).toLowerCase();
    const okX = x => x.id !== w.id && val(x) !== val(w) && !Data.related(w, x) && (field !== "sp" || x.sp);
    const same = Data.words.filter(x => okX(x) && x.setId === w.setId);
    const other = Data.words.filter(x => okX(x) && x.setId !== w.setId);
    const pool = U.shuffle(same).concat(U.shuffle(other));
    const out = [], seen = new Set([val(w)]);
    for (const x of pool) { if (!seen.has(val(x))) { seen.add(val(x)); out.push(x); } if (out.length >= n) break; }
    return out;
  },

  sentence(item, needDe) {
    const w = item.w, st = Lesson.st;
    let list = Data.sentencesWith(w);
    if (needDe) list = w.ex.filter(e => e.de && e.en.split(" ").length <= 9);
    const used = st.usedSentences[w.id] || [];
    const fresh = list.filter(e => !used.includes(e.en));
    const s = U.pick(fresh.length ? fresh : list);
    st.usedSentences[w.id] = used.concat(s.en);
    return s;
  },

  /* Beispielsatz mit unterstrichenem Vokabelwort */
  under(w, en) {
    const hit = Data.findIn(w, en);
    if (!hit) return U.esc(en);
    return U.esc(en).replace(U.wordRegex(U.esc(hit.form)), (m, pre, word) => pre + `<u class="vw">${word}</u>`);
  },
  exampleBox(w, s, cls) {
    return `<div class="ex-sent ${cls || ""}"><span class="ex-en">${this.under(w, s.en)}</span> ${Speech.btn(s.en, "small")}</div>`;
  },
  /* Satz mit dem Wort darin, möglichst einer, der in dieser Runde noch nicht dran war */
  exampleFor(item) { return Data.sentencesWith(item.w).length ? this.sentence(item) : null; },

  bindSay(root) { root.querySelectorAll("[data-say]").forEach(b => b.onclick = e => { e.stopPropagation(); Speech.say(b.dataset.say, b.classList.contains("slow")); }); },

  mcOptions(item, body, opts, correctIdx, onDone) {
    const box = body.querySelector(".options");
    box.innerHTML = opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("");
    let locked = false;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return; locked = true;
      const i = +b.dataset.i, ok = i === correctIdx;
      b.classList.add(ok ? "right" : "wrong");
      box.children[correctIdx].classList.add("right");
      box.querySelectorAll(".opt").forEach(x => x.disabled = true);
      onDone(ok);
    });
  },

  mc_en_de(item, body) {
    const w = item.w;
    const ds = this.distractors(w, "de", 3);
    const all = U.shuffle([w].concat(ds));
    const ex = this.exampleFor(item);
    body.innerHTML = this.head(item, ex ? "Was heißt das unterstrichene Wort?" : "Was heißt das auf Deutsch?") +
      (ex ? `<div class="prompt sentence task-sent"><div class="ts-line">${this.under(w, ex.en)} ${Speech.btn(ex.en, "small")}</div>
              <div class="word-small">${U.esc(w.en)} ${Speech.btn(w.say, "small")}</div></div>`
          : `<div class="prompt big-word">${U.esc(w.en)} ${Speech.btn(w.say)}</div>`) + `<div class="options"></div>`;
    this.bindSay(body);
    this.mcOptions(item, body, all.map(x => U.esc(x.de)), all.indexOf(w), ok => Lesson.answer(item, ok, { correct: w.de, sentShown: !!ex }));
    Speech.say(ex ? ex.en : w.say);
  },

  mc_de_en(item, body) {
    const w = item.w;
    const ds = this.distractors(w, "en", 3);
    const all = U.shuffle([w].concat(ds));
    body.innerHTML = this.head(item, "Wähle das englische Wort.") +
      `<div class="prompt big-word de">${U.esc(w.de)}</div><div class="options"></div>`;
    this.mcOptions(item, body, all.map(x => U.esc(x.en)), all.indexOf(w), ok => Lesson.answer(item, ok, { correct: w.en, sayAfter: w.say }));
  },

  cloze_mc(item, body) {
    const w = item.w, s = this.sentence(item);
    const hit = Data.findIn(w, s.en) || { form: w.en, text: w.en };
    const html = U.esc(s.en).replace(U.wordRegex(U.esc(hit.form)), (m, pre) => pre + `<span class="gap">_____</span>`);
    const ds = this.distractors(w, "sp", 2);
    const all = U.shuffle([w].concat(ds));
    const mm = U.wordRegex(hit.form).exec(s.en), before = mm ? s.en.slice(0, mm.index + mm[1].length) : "";
    const atStart = /^\s*["“„']?$/.test(before) || /([.!?:]\s*["“„']?|[–-])\s*$/.test(before);
    const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
    const right = atStart ? cap(hit.text) : /^[A-Z]/.test(hit.form) ? hit.text : hit.text.charAt(0).toLowerCase() + hit.text.slice(1);
    body.innerHTML = this.head(item, "Welches Wort passt in die Lücke?") +
      `<div class="prompt sentence">${html}</div>${s.de ? `<div class="help-de">${U.esc(s.de)}</div>` : ""}<div class="options"></div>`;
    this.mcOptions(item, body, all.map(x => U.esc(x === w ? right : atStart ? cap(x.sp) : x.sp)), all.indexOf(w), ok => Lesson.answer(item, ok, {
      correctHtml: `<div class="full-sent">${this.under(w, s.en)} ${Speech.btn(s.en, "small")}</div>`,
      html: `Richtig ist: <b>${U.esc(right)}</b><div class="full-sent">${this.under(w, s.en)} ${Speech.btn(s.en, "small")}</div>`,
      sayAfter: s.en, sentShown: true }));
  },

  context(item, body) {
    const w = item.w, s = this.sentence(item);
    const hit = Data.findIn(w, s.en) || { form: w.en };
    const html = U.esc(s.en).replace(U.wordRegex(U.esc(hit.form)), (m, pre, word) => pre + `<u class="vw hl">${word}</u>`);
    const ds = this.distractors(w, "de", 3);
    const all = U.shuffle([w].concat(ds));
    body.innerHTML = this.head(item, "Was bedeutet das farbige Wort?") +
      `<div class="prompt sentence">${html} ${Speech.btn(s.en, "small")}</div><div class="options"></div>`;
    this.bindSay(body);
    this.mcOptions(item, body, all.map(x => U.esc(x.de)), all.indexOf(w), ok => Lesson.answer(item, ok, { correct: w.de, sentShown: true }));
    Speech.say(s.en);
  },

  /* Übersetzen (Bedeutung): Tippfehler sind erlaubt */
  translate_type(item, body, foot) {
    const w = item.w;
    body.innerHTML = this.head(item, "Schreib das Wort auf Englisch.") +
      `<div class="prompt big-word de">${U.esc(w.de)}</div>
       <input class="type-in" type="text" ${U.inputAttrs} placeholder="auf Englisch …">`;
    const inp = body.querySelector("input");
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    inp.oninput = () => btn.disabled = !inp.value.trim();
    const check = () => {
      if (!inp.value.trim()) return;
      inp.disabled = true; btn.disabled = true;
      const a = U.stripArticle(U.norm(inp.value));
      let best = null;
      w.forms.forEach(f => { const t = U.stripArticle(U.norm(f)); const dist = U.lev(a, t)[a.length][t.length];
        const tol = t.length <= 3 ? 0 : t.length <= 7 ? 1 : 2;
        if (!best || dist - tol < best.dist - best.tol) best = { dist, tol }; });
      const exact = best.dist === 0;
      const ok = best.dist <= best.tol;
      inp.classList.add(ok ? "right" : "wrong");
      Lesson.answer(item, ok, { near: ok && !exact, correct: w.en, sayAfter: w.say });
    };
    btn.onclick = check;
    inp.onkeydown = e => { if (e.key === "Enter") check(); };
    setTimeout(() => inp.focus(), 50);
  },

  /* Satz übersetzen mit Wortkacheln */
  sentence_tiles(item, body, foot) {
    const w = item.w, s = this.sentence(item, true);
    const clean = s.en.replace(/[.!?]+$/, "");
    const end = s.en.slice(clean.length);
    const words = clean.split(" ");
    const others = Data.words.filter(x => x.id !== w.id).flatMap(x => x.ex.map(e => e.en.replace(/[.!?]+$/, "").split(" "))).flat()
      .filter(t => !words.map(x => x.toLowerCase()).includes(t.toLowerCase()) && /^[a-z']+$/i.test(t));
    const extra = U.shuffle([...new Set(others)]).slice(0, 2);
    const tiles = U.shuffle(words.concat(extra)).map((t, i) => ({ t, i }));
    body.innerHTML = this.head(item, "Bau den Satz auf Englisch.") +
      `<div class="prompt sentence de">${U.esc(s.de)}</div>
       <div class="answer-line"></div><div class="tile-pool"></div>`;
    const line = body.querySelector(".answer-line"), pool = body.querySelector(".tile-pool");
    const chosen = [];
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    const draw = () => {
      line.innerHTML = chosen.map((c, k) => `<button class="tile word" data-k="${k}">${U.esc(c.t)}</button>`).join("") || `<span class="placeholder">Tippe die Wörter an</span>`;
      pool.innerHTML = tiles.map(c => `<button class="tile word ${chosen.includes(c) ? "used" : ""}" data-i="${c.i}" ${chosen.includes(c) ? "disabled" : ""}>${U.esc(c.t)}</button>`).join("");
      line.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { chosen.splice(+b.dataset.k, 1); Sound.play("tap"); draw(); });
      pool.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { chosen.push(tiles.find(c => c.i === +b.dataset.i)); Sound.play("tap"); draw(); });
      btn.disabled = !chosen.length;
    };
    draw();
    btn.onclick = () => {
      btn.disabled = true;
      line.querySelectorAll("button").forEach(b => b.disabled = true); pool.querySelectorAll("button").forEach(b => b.disabled = true);
      const ok = U.norm(chosen.map(c => c.t).join(" ")) === U.norm(clean);
      line.classList.add(ok ? "right" : "wrong");
      Lesson.answer(item, ok, {
        correctHtml: `<div class="full-sent">${this.under(w, clean + end)} ${Speech.btn(s.en, "small")}</div>`,
        html: `Richtig ist:<div class="full-sent">${this.under(w, clean + end)} ${Speech.btn(s.en, "small")}</div>`,
        sayAfter: s.en, sentShown: true });
    };
  },

  /* Karten zuordnen */
  match(item, body, foot) {
    const words = item.words;
    const left = U.shuffle(words), right = U.shuffle(words);
    body.innerHTML = Lesson.badges(item) + `<div class="instr">Finde die Paare.</div>
      <div class="match"><div class="mcol">${left.map(w => `<button class="mcard" data-id="${U.esc(w.id)}" data-side="en">${U.esc(w.en)}</button>`).join("")}</div>
      <div class="mcol">${right.map(w => `<button class="mcard" data-id="${U.esc(w.id)}" data-side="de">${U.esc(w.de)}</button>`).join("")}</div></div>`;
    let sel = null, done = 0, errors = 0;
    const wrongIds = new Set();
    body.querySelectorAll(".mcard").forEach(b => b.onclick = () => {
      if (b.classList.contains("done")) return;
      if (b.dataset.side === "en") Speech.say(Data.byId[b.dataset.id].say);
      if (!sel) { sel = b; b.classList.add("sel"); Sound.play("tap"); return; }
      if (sel === b) { b.classList.remove("sel"); sel = null; return; }
      if (sel.dataset.side === b.dataset.side) { sel.classList.remove("sel"); sel = b; b.classList.add("sel"); return; }
      if (sel.dataset.id === b.dataset.id) {
        sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); Sound.play("correct"); done++;
      } else {
        errors++;
        const enCard = sel.dataset.side === "en" ? sel : b;
        wrongIds.add(enCard.dataset.id);
        [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("shake"); setTimeout(() => x.classList.remove("shake"), 450); });
        Sound.play("wrong");
      }
      sel = null;
      if (done === words.length) {
        // falsch zugeordnete Wörter kommen als Bedeutungsaufgabe wieder
        wrongIds.forEach(id => Lesson.scheduleRetry({ w: Data.byId[id], part: "m", review: item.review, isNew: !item.review }));
        const ok = errors === 0;
        const st = Lesson.st;
        st.answered++;
        if (ok) { st.correctFirst++; st.combo++; st.xp += Lesson.xp.correct; } else st.combo = 0;
        Lesson.feedback({ kind: "match", w: null, retry: false }, true, errors ? { noGain: true, correctHtml: `Alle Paare gefunden! Die vertauschten Wörter üben wir gleich noch einmal.` } : {});
      }
    });
  },

  /* ---- Rechtschreibung ---- */
  spellFeedback(item, ans, anyForm) {
    const w = item.w;
    // Hören+Tippen: jede Schreibweise aus dem Buch zählt ("know" und "to know"), Satzzeichen am Ende egal
    ans = String(ans).replace(/[’`´]/g, "'");   // iPhone setzt gern ein „schönes“ Apostroph
    const clean = anyForm ? ans.replace(/[\s.?!]+$/, "").replace(/\s+/g, " ") : ans;
    let tgt = w.sp, d = U.diff(clean, tgt);
    if (anyForm) w.forms.forEach(f => { const d2 = U.diff(clean, f); if (d2.dist < d.dist) { d = d2; tgt = f; } });
    const ok = d.dist === 0;
    const caseNote = ok && clean !== tgt ? `<div class="note">Achtung: So schreibt man es genau: <b>${U.esc(tgt)}</b></div>` : "";
    const tricky = U.trickySet(w, tgt);
    Lesson.answer(item, ok, ok ? {
      correctHtml: `<div class="spelled">${U.letters(tgt, tricky, "tricky")} ${Speech.btn(tgt, "small")}</div>${caseNote}`, sayAfter: tgt
    } : {
      spell: true, sayAfter: tgt,
      html: `<div class="cmp"><div class="cmp-row"><span class="cmp-l">Du:</span> <span class="spelled">${U.letters(clean || "–", d.badA, "bad")}</span></div>
             <div class="cmp-row"><span class="cmp-l">Richtig:</span> <span class="spelled">${U.letters(tgt, d.badB, "good")}</span> ${Speech.btn(tgt, "small")}</div></div>`
    });
  },

  spell_tiles(item, body, foot) {
    const w = item.w, st = Lesson.st;
    const chars = [...w.sp];
    const slots = chars.map((c, i) => /[A-Za-z']/.test(c) ? null : c); // Leerzeichen und Schrägstrich sind fest, der Apostroph ist eine Kachel
    const needed = chars.filter(c => /[A-Za-z']/.test(c));
    const extraN = (item.isNew || item.wasNew || (st.attempts[w.id + "s"] || 0) >= 2) ? 0 : Math.min(3, Math.ceil(needed.length / 4));
    const alpha = "abcdefghiklmnoprstuwy";
    const extra = []; for (let i = 0; i < extraN; i++) extra.push(U.pick([...alpha]));
    const tiles = U.shuffle(needed.concat(extra)).map((c, i) => ({ c, i }));
    body.innerHTML = this.head(item, "Setz das Wort aus den Buchstaben zusammen.") +
      `<div class="prompt big-word de">${U.esc(w.de)} ${Speech.btn(w.sp)}</div>
       <div class="slots"></div><div class="tile-pool letters"></div>`;
    this.bindSay(body);
    const slotsEl = body.querySelector(".slots"), pool = body.querySelector(".tile-pool");
    const placed = []; // Kacheln in Reihenfolge
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    const draw = () => {
      let k = 0;
      slotsEl.innerHTML = chars.map((c, i) => {
        if (slots[i] !== null) return c === " " ? `<span class="slot space"></span>` : `<span class="slot fixed">${U.esc(c)}</span>`;
        const t = placed[k++];
        return `<button class="slot ${t ? "filled" : ""}" ${t ? `data-k="${k - 1}"` : "disabled"}>${t ? U.esc(t.c) : ""}</button>`;
      }).join("");
      pool.innerHTML = tiles.map(t => `<button class="tile letter ${placed.includes(t) ? "used" : ""}" data-i="${t.i}" ${placed.includes(t) ? "disabled" : ""}>${U.esc(t.c)}</button>`).join("");
      slotsEl.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { placed.splice(+b.dataset.k, 1); Sound.play("tap"); draw(); });
      pool.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
        if (placed.length >= needed.length) return;
        placed.push(tiles.find(t => t.i === +b.dataset.i)); Sound.play("tap"); draw();
      });
      btn.disabled = placed.length !== needed.length;
    };
    draw();
    btn.onclick = () => {
      btn.disabled = true;
      body.querySelectorAll(".slots button, .tile-pool button").forEach(b => b.disabled = true);
      let k = 0;
      const ans = chars.map((c, i) => slots[i] !== null ? c : placed[k++].c).join("");
      slotsEl.classList.add(U.diff(ans, w.sp).dist === 0 ? "right" : "wrong");
      this.spellFeedback(item, ans);
    };
    Speech.say(w.sp);
  },

  spell_gap(item, body, foot) {
    const w = item.w;
    const chars = [...w.sp];
    const letterIdx = chars.map((c, i) => /[A-Za-z]/.test(c) ? i : -1).filter(i => i >= 0);
    let gaps = [...U.trickySet(w, w.sp)].filter(i => letterIdx.includes(i));
    const want = Math.min(letterIdx.length - 1, Math.max(1, Math.round(letterIdx.length / 4)));
    if (gaps.length > 3) gaps = gaps.slice(0, 3);
    const vowels = U.shuffle(letterIdx.filter(i => /[aeiouy]/i.test(chars[i]) && !gaps.includes(i) && i > 0));
    while (gaps.length < want && vowels.length) gaps.push(vowels.shift());
    const restI = U.shuffle(letterIdx.filter(i => !gaps.includes(i) && i > 0));
    while (gaps.length < want && restI.length) gaps.push(restI.shift());
    if (!gaps.length && letterIdx.length) gaps.push(letterIdx[letterIdx.length - 1]);   // ganz kurze Wörter wie "o"
    gaps.sort((a, b) => a - b);
    body.innerHTML = this.head(item, "Ergänze die fehlenden Buchstaben.") +
      `<div class="prompt big-word de">${U.esc(w.de)} ${Speech.btn(w.sp)}</div>
       <div class="gapword">${chars.map((c, i) => gaps.includes(i) ? `<input class="gapin" maxlength="1" data-i="${i}" ${U.inputAttrs}>` : `<span class="gl">${c === " " ? "&nbsp;" : U.esc(c)}</span>`).join("")}</div>`;
    this.bindSay(body);
    const ins = [...body.querySelectorAll(".gapin")];
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    ins.forEach((inp, k) => {
      inp.oninput = () => {
        inp.value = inp.value.slice(-1);
        if (inp.value && ins[k + 1]) ins[k + 1].focus();
        btn.disabled = ins.some(x => !x.value);
      };
      inp.onkeydown = e => {
        if (e.key === "Backspace" && !inp.value && ins[k - 1]) ins[k - 1].focus();
        if (e.key === "Enter" && !btn.disabled) btn.click();
      };
    });
    btn.onclick = () => {
      btn.disabled = true; ins.forEach(x => x.disabled = true);
      const ans = chars.map((c, i) => gaps.includes(i) ? (body.querySelector(`.gapin[data-i="${i}"]`).value || "?") : c).join("");
      ins.forEach(x => x.classList.add(x.value.toLowerCase() === chars[+x.dataset.i].toLowerCase() ? "right" : "wrong"));
      this.spellFeedback(item, ans);
    };
    setTimeout(() => ins[0] && ins[0].focus(), 50);
  },

  spell_listen(item, body, foot) {
    const w = item.w;
    body.innerHTML = this.head(item, "Hör gut zu und schreib das Wort.") +
      `<div class="listen-row"><button class="say huge" data-say="${U.esc(w.say)}">🔊</button><button class="say slow" data-say="${U.esc(w.say)}" aria-label="Langsam">🐢</button></div>
       <button class="tipbtn">Tipp: auf Deutsch zeigen</button>
       <input class="type-in" type="text" ${U.inputAttrs} placeholder="Schreib, was du hörst …">`;
    this.bindSay(body);
    body.querySelector(".tipbtn").onclick = e => { e.target.outerHTML = `<div class="help-de">${U.esc(w.de)}</div>`; };
    const inp = body.querySelector("input");
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    inp.oninput = () => btn.disabled = !inp.value.trim();
    const check = () => { if (!inp.value.trim()) return; inp.disabled = true; btn.disabled = true; this.spellFeedback(item, inp.value.trim(), true); };
    btn.onclick = check;
    inp.onkeydown = e => { if (e.key === "Enter") check(); };
    Speech.say(w.say);
    setTimeout(() => inp.focus(), 50);
  }
};

const Engine = {
  onXP: null,
  init(opts) {
    Data.load(VOCAB_SETS);
    Store.load(opts.storageKey);
    Plan.spreadAfterBreak();
    Speech.init();
    this.onXP = opts.onXP || null;
    document.addEventListener("click", () => Sound.ensure(), { once: true });

  startNew(setId, packIndex, opts) { Lesson.start(Builder.newLesson(setId, packIndex), opts); },

    const p = Builder.packReview(setId, packIndex);
    if (!p) return false;
    Lesson.start(p, opts); return true;
  },
  startExam(setId, from, to, opts) {
    const p = Builder.examLesson(setId, from, to, 15);
    if (!p) return false;
    Lesson.start(p, opts); return true;
  },
  startReview(n, opts, fillWeak, setId) {
    const p = Builder.reviewLesson(n, fillWeak, setId);
    if (!p) return false;
    Lesson.start(p, opts); return true;
  }
};

  /* Sprite als eigenes, skaliertes Element (in % des Szenenrahmens) */
  el(name, cls, x, y, W, H, flip) {

Pix.variant = function (name, map, outline) {
  const key = name + JSON.stringify(map || {}) + (outline ? "o" : "");
  if (this.cache[key]) return this.cache[key];
  const rows = SPR[name], h = rows.length, w = Math.max(...rows.map(r => r.length));
  const pal = Object.assign({}, PAL, map || {});
  const c = document.createElement("canvas"); c.width = w + (outline ? 2 : 0); c.height = h + (outline ? 2 : 0);
  const g = c.getContext("2d"), o = outline ? 1 : 0;
  if (outline) {
    g.fillStyle = "#2a2130";
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== "." && pal[ch]) { g.fillRect(x, y + 1, 1, 1); g.fillRect(x + 2, y + 1, 1, 1); g.fillRect(x + 1, y, 1, 1); g.fillRect(x + 1, y + 2, 1, 1); } }));
  }
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== "." && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x + o, y + o, 1, 1); } }));
  return this.cache[key] = c;
};
Pix.elVar = function (name, map, outline, cls, cx, by, W, H) {
  const src = this.variant(name, map, outline);
  const c = document.createElement("canvas"); c.width = src.width; c.height = src.height;
  c.getContext("2d").drawImage(src, 0, 0);
  c.className = "px " + (cls || "");
  // Ankerpunkt: unten in der Mitte
  c.style.left = (100 * (cx - src.width / 2) / W) + "%"; c.style.top = (100 * (by - src.height) / H) + "%"; c.style.width = (100 * src.width / W) + "%";
  c.style.zIndex = Pix.depth(by, cls);
  return c;
};

    if (!this.embedded) { this.registerSW(); this.installHint(); }
  },

  /* Browser bitten, den Speicher nicht automatisch zu löschen */
  persist() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then(p => { if (!p) return navigator.storage.persist(); }).catch(() => {});
      }
    } catch (e) {}
  },

  /* Service Worker (Muster wie Familienbank: Update-Banner, skipWaiting per Nachricht) */
  registerSW() {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
    navigator.serviceWorker.register("./sw.js").then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) this.updateBanner(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) this.updateBanner(nw);
        });
      });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
    // nur neu laden, wenn das Kind auf "Jetzt aktualisieren" getippt hat (nicht beim allerersten Installieren)
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!this.updating || reloading) return; reloading = true; location.reload(); });
  },

  banner(html, cls) {
    const old = document.querySelector(".pwa-banner." + cls); if (old) old.remove();
    const b = document.createElement("div");
    b.className = "pwa-banner " + cls;
    b.innerHTML = `<div class="pwa-inner">${html}<button class="pwa-x" aria-label="Schließen">✕</button></div>`;
    b.querySelector(".pwa-x").onclick = () => b.remove();
    document.body.appendChild(b);
    return b;
  },

  updateBanner(worker) {
    const b = this.banner(`<div class="pwa-txt"><b>✨ Neue Version da!</b><br>Neue Wörter oder Verbesserungen.</div>
      <button class="pwa-btn" data-upd>Jetzt aktualisieren</button>`, "upd");
    b.querySelector("[data-upd]").onclick = () => { this.updating = true; worker.postMessage({ type: "SKIP_WAITING" }); b.remove(); };
  },

  isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); },
  standalone() { return navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); },

  /* Hinweis: App auf den Home-Bildschirm legen (nur so bleibt der Fortschritt auf dem iPhone sicher) */
  installHint() {
    if (this.standalone()) return;
    let seen = false;
    try { seen = sessionStorage.getItem("pwa-hint") === "1"; sessionStorage.setItem("pwa-hint", "1"); } catch (e) {}
    if (this.isIOS() && !seen) {
      this.banner(`<div class="pwa-txt"><b>📲 Leg mich auf deinen Home-Bildschirm!</b><br>
        Nur so bleibt dein Fortschritt sicher gespeichert. Tippe in Safari auf <b>Teilen</b>
        <span class="pwa-share">⬆︎</span> und dann auf <b>„Zum Home-Bildschirm“</b>.</div>`, "ios");
    }
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      const b = this.banner(`<div class="pwa-txt"><b>📲 Als App installieren</b><br>Dann bleibt dein Fortschritt sicher gespeichert.</div>
        <button class="pwa-btn" data-inst>Installieren</button>`, "and");
      b.querySelector("[data-inst]").onclick = () => { e.prompt(); b.remove(); };
    });
  },

  /* ---------- Sicherungscode ---------- */
  b64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); },
  unb64(str) { const bin = atob(str), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; },
  async exportCode() {
    const json = JSON.stringify(Store.data);
    if (window.CompressionStream) {
      try {
        const cs = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
        return this.prefix + "z:" + this.b64(new Uint8Array(await new Response(cs).arrayBuffer()));
      } catch (e) {}
    }
    return this.prefix + ":" + this.b64(new TextEncoder().encode(json));
  },
  async importCode(code) {
    // robust gegen Text drumherum (z. B. aus WhatsApp), Anführungszeichen,
    // unsichtbare Zeichen und Groß-/Kleinschreibung des Anfangs
    const raw = String(code || "");
    const m = raw.match(/([A-Za-z]{3}1)\s*(z?)\s*:\s*([A-Za-z0-9+/=\s\u00a0\u200b-\u200d\u2060\ufeff]+)/);
    if (!m) throw new Error("Das ist kein Sicherungscode für diese App.");
    const pre = m[1].toUpperCase();
    if (pre !== this.prefix) {
      if (pre === "MIO1" || pre === "ZOO1") throw new Error(pre === "MIO1" ? "Das ist ein Code aus der Mio-App. Bitte dort einfügen." : "Das ist ein Code aus Mios Zoo. Bitte dort einfügen.");
      throw new Error("Das ist kein Sicherungscode für diese App.");
    }
    // Base64 endet spätestens mit den "="-Zeichen – Text danach ignorieren
    const body = m[3].replace(/[^A-Za-z0-9+/=]/g, "").replace(/^([^=]*=+).*$/, "$1");
    let json;
    try {
      if (m[2]) {
        if (!window.DecompressionStream) throw new Error("Dieses Gerät kann den Code nicht lesen.");
        const ds = new Blob([this.unb64(body)]).stream().pipeThrough(new DecompressionStream("gzip"));
        json = await new Response(ds).text();
      } else json = new TextDecoder().decode(this.unb64(body));
    } catch (e) {
      if (/Gerät/.test(e.message)) throw e;
      throw new Error("Der Code ist unvollständig. Bitte den ganzen Code kopieren.");
    }
    let d; try { d = JSON.parse(json); } catch (e) { throw new Error("Der Code ist unvollständig. Bitte den ganzen Code kopieren."); }
    if (!d || typeof d !== "object" || typeof d.words !== "object") throw new Error("Der Code ist unvollständig.");
    return d;
  },

  backupSection() {
    return `<section class="card backup">
      <p class="bk-title">💾 Fortschritt sichern</p>
      <p class="small">Für ein neues Handy: Code erstellen, kopieren und dir selbst schicken. Auf dem neuen Handy hier einfügen.</p>
      <button class="btn" data-bk-make>Sicherungscode erstellen</button>
      <div data-bk-out></div>
      <button class="btn" data-bk-restore>Code einfügen und wiederherstellen</button>
    </section>`;
  },

  modal(html) {
    let d = document.getElementById("pwa-dlg");
    if (!d) { d = document.createElement("div"); d.id = "pwa-dlg"; d.className = "dialog pwa-dialog"; document.body.appendChild(d); }
    d.hidden = false; d.innerHTML = `<div class="dlg-box">${html}</div>`;
    const close = () => { d.hidden = true; d.innerHTML = ""; };
    d.querySelectorAll("[data-x]").forEach(b => b.onclick = close);
    d.onclick = e => { if (e.target === d) close(); };
    return d;
  },

  bindBackup(root) {
    const mk = root.querySelector("[data-bk-make]");
    if (mk) mk.onclick = async () => {
      const out = root.querySelector("[data-bk-out]");
      const code = await this.exportCode();
      out.innerHTML = `<textarea class="bk-code" readonly>${U.esc(code)}</textarea>
        <button class="btn primary" data-bk-copy>📋 Code kopieren</button>
        <p class="small">Schick dir den Code zum Beispiel als Nachricht. Er enthält nur deinen Lernstand – keine Namen.</p>`;
      const ta = out.querySelector("textarea");
      out.querySelector("[data-bk-copy]").onclick = async e => {
        try { await navigator.clipboard.writeText(code); e.target.textContent = "✓ Kopiert"; }
        catch (err) { ta.focus(); ta.select(); e.target.textContent = "Text ist markiert – jetzt kopieren"; }
      };
    };
    const rs = root.querySelector("[data-bk-restore]");
    if (rs) rs.onclick = () => {
      const d = this.modal(`<p class="dlg-title">Fortschritt wiederherstellen</p>
        <p class="small">Füge hier deinen Sicherungscode ein.</p>
        <textarea class="bk-code" data-bk-in ${U.inputAttrs}></textarea>
        <p class="bk-err" data-bk-err></p>
        <button class="btn primary big" data-bk-go>Wiederherstellen</button>
        <button class="btn ghost" data-x>Abbrechen</button>`);
      d.querySelector("[data-bk-go]").onclick = async () => {
        const err = d.querySelector("[data-bk-err]");
        try {
          const data = await this.importCode(d.querySelector("[data-bk-in]").value);
          const box = d.querySelector(".dlg-box");
          box.innerHTML = `<p class="dlg-title">Code ist gültig ✓</p>
            <p>Dein jetziger Fortschritt auf diesem Handy wird dabei <b>ersetzt</b>.</p>
            <button class="btn primary big" data-bk-ok>Ja, wiederherstellen</button><button class="btn ghost" data-x>Abbrechen</button>`;
          box.querySelector("[data-x]").onclick = () => { d.hidden = true; };
          box.querySelector("[data-bk-ok]").onclick = () => {
            Store.data = Object.assign(Store.defaults(), data); Store.save();
            location.reload();
          };
        } catch (e) { err.textContent = e.message && /Code|Gerät|App/.test(e.message) ? e.message : "Der Code stimmt nicht. Bitte ganz kopieren."; }
      };
    };
  }
};

/* Erzeugt aus einer Routine CSS-Animationen (pro Bild eine Spur) */
const Routine = {
  done: {},
  parts(s) {
    const fx = Array.isArray(s.fx) ? s.fx : s.fx ? [s.fx] : [];
    return [{ k: s.f, f: s.f, a: s.a, b: s.b, flip: s.flip, rot: s.rot }].concat(fx.map(x => ({ k: x.id || x.f, f: x.f, a: x.a, b: x.b, flip: !!x.flip })));
  },
  build(key, segs, once) {
    if (this.done[key]) return this.done[key];
    const T = segs.reduce((s, x) => s + x.t, 0);
    const tracks = {}, sprites = {};
    const add = (k, p, props) => { (tracks[k] = tracks[k] || []).push([p, props]); };
    const pos = (xy, flip, r) => `left:${(100 * xy[0] / 64).toFixed(3)}%;top:${(100 * xy[1] / 44).toFixed(3)}%;transform:scaleX(${flip ? -1 : 1}) rotate(${r || 0}deg)`;
    segs.forEach(s => this.parts(s).forEach(v => sprites[v.k] = v.f));
    const keys = Object.keys(sprites);
    let t = 0;
    const sounds = [];
    // Tiefe: das Tier, dessen Füße weiter unten im Gehege sind, steht vorn. Effekte (Noten, Blasen, Spielzeug)
    // gehören zum Tier und liegen direkt davor.
    const zOf = (f, xy) => Pix.depth(xy[1] + Pix.size(f).h);
    segs.forEach(s => {
      const p0 = 100 * t / T, p1 = 100 * (t + s.t) / T;
      if (s.sound) sounds.push({ sound: s.sound, at: t });
      t += s.t;
      const za = zOf(s.f, s.a), zb = zOf(s.f, s.b || s.a);
      const vis = new Map(this.parts(s).map((v, i) => [v.k, Object.assign({ z0: za + (i ? 1 : 0), z1: zb + (i ? 1 : 0) }, v)]));
      keys.forEach(k => {
        const v = vis.get(k);
        if (v) { add(k, p0 + 0.01, `opacity:1;z-index:${v.z0};` + pos(v.a, v.flip, v.rot && v.rot[0])); add(k, p1, `opacity:1;z-index:${v.z1};` + pos(v.b || v.a, v.flip, v.rot && v.rot[1])); }
        else { add(k, p0 + 0.01, "opacity:0"); add(k, p1, "opacity:0"); }
      });
    });
    let css = "";
    const list = keys.map(k => {
      const cls = `rt_${key}_${k}`;
      const stops = tracks[k].map(([p, pr]) => `${Math.min(100, p).toFixed(3)}%{${pr}}`).join("");
      css += `@keyframes ${cls}{0%{opacity:0}${stops}}.${cls}{animation:${cls} ${T.toFixed(2)}s linear ${once ? "1 forwards" : "infinite"};}`;
      return { k, f: sprites[k], cls };
    });
    const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
    return this.done[key] = { T, list, sounds };
  },
  /* Bilder der Routine in eine Szene setzen */
  mount(el, key, segs, opts) {
    opts = opts || {};
    const r = this.build(key, segs, opts.once);
    let first = null;
    r.list.forEach(({ f, cls }) => {
      const s = Pix.size(f);
      const wrap = document.createElement("div");
      wrap.className = "actor " + cls;
      wrap.style.width = (100 * s.w / 64) + "%";
      if (opts.delay) wrap.style.animationDelay = (-r.T * opts.delay).toFixed(2) + "s";
      const c = Pix.icon(f); c.className = "px-frame" + (ANIMALS.some(a => a.id === f) || f === "lioness" ? " step" : "") + (opts.frameClass ? " " + opts.frameClass : "");
      wrap.appendChild(c); el.appendChild(wrap);
      if (!first) first = wrap;
    });
    // Töne passend zur Animation (über eine unsichtbare CSS-Spur, kein Timer)
    // Töne bei jeder Wiederholung der Runde, im Takt der Animation – auch in der Zoo-Übersicht.
    // Still während der Aufgaben; ist ein Gehege groß geöffnet, tönt nur dieses (nicht doppelt).
    if (opts.sound) r.sounds.forEach(sd => {
      const cue = document.createElement("div"); cue.className = "cue";
      cue.style.animationDuration = r.T.toFixed(2) + "s";
      cue.style.animationDelay = sd.at.toFixed(2) + "s";
      cue.style.animationIterationCount = opts.once ? "1" : "infinite";
      const ring = () => {
        if (!cue.isConnected || document.hidden || document.body.classList.contains("in-lesson")) return;
        const dlg = document.querySelector(".dialog:not([hidden])");
        if (dlg && !dlg.contains(cue)) return;
        Sound.play(sd.sound);
      };
      cue.addEventListener("animationstart", ring);
      cue.addEventListener("animationiteration", ring);
      el.appendChild(cue);
    });
    if (opts.onEnd && first) first.addEventListener("animationend", e => { if (e.target === first) opts.onEnd(); }, { once: false });
    return first;
  }
};

];
const GATE_FAST = 4;   // die ersten Teile dürfen zu zweit am Tag kommen
/* Saison-Deko am Eingang (Mitte unten, in Pixeln des Eingangs 128×64) */
const GATE_DECO_POS = { pumpkin: [45, 47], lantern: [96, 42], ghost: [64, 36], presents: [46, 62], xtree: [15, 46], snowman: [106, 51], candles: [89, 60], cane: [117, 59] };

const App = {
  view: "zoo",
  get A() { return Store.data.app; },

  init() {
    Engine.init({ storageKey: APP_CHANNEL === "public" ? "mios-zoo-v1" : "zoo-vokabeln-v1", onXP: n => {
      const A = this.A, t = U.today();

      Object.assign(A, { init: true, wallet: 0, inv: { fish: 1, meat: 0, feed: 0 }, animals: {}, unlocked: [], event: null,
        lastEventRoll: null, setId: Data.sets[0].id, welcome: [], toys: {}, days: {} });
    }
    if (!Data.set(A.setId)) A.setId = Data.sets[0].id;

    A.gateQueue = A.gateQueue || [];
    if (A.gateShown == null) A.gateShown = Math.min(this.gateBudget(), 2);
    // Zähler für die Tierbabys einmalig aus den gespeicherten Tagen ableiten
    if (A.stats.powerDays == null) {
      const days = Object.keys(A.days).map(Number).sort((x, y) => x - y);
      A.stats.powerDays = days.filter(d => A.days[d] >= 2).length;
      let run = 0, prev = null, weeks = 0;
      days.forEach(d => { if (A.days[d] >= 1) { run = prev === d - 1 ? run + 1 : 1; if (run % 7 === 0) weeks++; prev = d; } else { run = 0; prev = null; } });

    this.ensureAnimals(true);

  },

  /* ---------- Spiellogik ---------- */
  donePacks() { return Data.sets.reduce((n, s) => n + Plan.packs(s.id).filter(p => p.done).length, 0); },
  ensureAnimals(first) {
    const A = this.A, t = U.today();
    const regular = ANIMALS.filter(a => !a.need);
    const target = Math.min(regular.length, ZOO.START_ANIMALS + this.donePacks());
    const isStart = A.unlocked.length === 0;
    let changed = false;
    while (A.unlocked.filter(id => regular.some(r => r.id === id)).length < target) {
      const a = regular.find(x => !A.unlocked.includes(x.id));
      A.unlocked.push(a.id);
      A.animals[a.id] = { fed: t - 1, clean: t };
      if (!isStart || A.unlocked.length > ZOO.START_ANIMALS) A.welcome.push(a.id);
      changed = true;
    }
    // Löwe: kommt, wenn genug Wörter sitzen
    ANIMALS.filter(a => a.need === "solid" && !A.unlocked.includes(a.id) && (Plan.solidCount() >= a.needN || Plan.reviewsDone() >= a.needAlt)).forEach(a => {
      A.unlocked.push(a.id); A.animals[a.id] = { fed: t - 1, clean: t }; A.welcome.push(a.id); changed = true;
    });
    if (changed || first) Store.save();
  },
  animal(id) { return ANIMALS.find(a => a.id === id); },
  hunger(id) { return Math.min(2, U.today() - this.A.animals[id].fed); },
  dirt(id) { return Math.min(2, U.today() - this.A.animals[id].clean); },
  /* Deutsch mit englischer Zeile darunter (1:1) */
  /* zweisprachig: Englisch groß, Deutsch klein darunter (Emojis wandern mit nach oben) */
  emo(de, en) {
    const m = String(de).replace(/<[^>]+>/g, "").match(/\p{Extended_Pictographic}[\uFE0F\u200D\p{Extended_Pictographic}]*/gu);
    if (!m || /\p{Extended_Pictographic}/u.test(en)) return en;
    const lead = /^\s*(<b>)?\s*\p{Extended_Pictographic}/u.test(de);
    return lead ? m[0] + " " + en : en + " " + m[m.length - 1];
  },
  bi(de, en) {
    const bold = /^\s*<b>/.test(de), top = this.emo(de, en);
    const deTxt = String(de).replace(/<\/?b>/g, "").replace(/\p{Extended_Pictographic}[\uFE0F\u200D\p{Extended_Pictographic}]*/gu, "").replace(/\s+/g, " ").trim();
    return `<span class="bi"><span>${bold ? "<b>" + top + "</b>" : top}</span><em class="en">${deTxt}</em></span>`;
  },
  bbtn(attr, de, en, cls) {
    const m = String(de).match(/^\s*(\p{Extended_Pictographic}[\uFE0F\u200D]*)\s*/u);
    const top = m && !/\p{Extended_Pictographic}/u.test(en) ? m[1] + " " + en : en, deTxt = m ? de.slice(m[0].length) : de;
    return `<button class="btn ${cls || "primary"} big bi-btn" ${attr}><span>${top}</span><em class="en">${deTxt}</em></button>`;
  },
  enName(a, two) { return "The " + (two ? a.enPl : a.en); },
  hasFriend(id) { return !!(this.A.animals[id] && this.A.animals[id].friend); },
  portions(id) { return this.hasFriend(id) ? 2 : 1; },
  /* heute schon gegebene Portionen (bei zwei Tieren braucht es zwei) */
  fedToday(id) { const x = this.A.animals[id]; if (x.fed === U.today()) return this.portions(id); return x.part && x.part.day === U.today() ? x.part.n : 0; },
  friendRoutine(id) {
    const F = FRIENDS[id];
    if (F.own === "owl2") return OWL2;
    if (F.own === "lioness") return LIONESS;
    const mv = xy => xy && [xy[0] + F.dx, xy[1] + F.dy];
    return ROUTINES[id].map(sg => Object.assign({}, sg, { a: mv(sg.a), b: mv(sg.b),
      fx: sg.fx && [].concat(sg.fx).map(x => Object.assign({}, x, { a: mv(x.a), b: mv(x.b) })) }));
  },
  stat(k) { return (this.A.stats && this.A.stats[k]) || 0; },
  bump(k) { this.A.stats[k] = this.stat(k) + 1; Store.save(); },
  season() {
    if (TEST_MODE && this.A.seasonTest) { const t = SEASONS.find(x => x.id === this.A.seasonTest); if (t) return t; }
    const d = new Date(), md = (d.getMonth() + 1) * 100 + d.getDate();
    return SEASONS.find(x => x.from <= x.to ? md >= x.from && md <= x.to : md >= x.from || md <= x.to) || SEASONS[0];
  },
  /* Aussehen der Gehege je Jahreszeit (gratis, nur angedeutet) */
  look() { return { autumn: "autumn", xmas: "winter", winter: "winter", spring: "spring", easter: "spring", latesummer: "late" }[this.season().id] || null; },
  seasonDecos() { const s = this.season(); return DECOS.filter(d => d.season === s.id || (d.also || []).includes(s.id)); },
  /* Adventskranz: so viele Kerzen brennen, wie Adventssonntage schon waren (der 4. Advent ist der Sonntag vor dem 25.12.) */
  adventCandles() {
    const d = new Date(), y = d.getMonth() === 0 ? d.getFullYear() - 1 : d.getFullYear();
    const xmas = new Date(y, 11, 25), a4 = new Date(y, 11, 24 - ((xmas.getDay() + 6) % 7));
    if (d.getMonth() === 0) return 4;
    let n = 0; for (let k = 3; k >= 0; k--) { const s = new Date(a4); s.setDate(a4.getDate() - 7 * k); if (d >= s) n++; }
    return Math.max(1, n);
  },
  hasDeco(id, aid) { return ((this.A.decos || {})[id] || []).includes(aid); },
  decoVariant(item, aid) {
    const i = Math.max(0, ANIMALS.findIndex(a => a.id === aid)), c1 = DECO_COLORS[i % DECO_COLORS.length], c2 = DECO_COLORS[(i + 3) % DECO_COLORS.length];
    if (item.id === "pumpkin") return { name: i % 2 ? "pumpkin2" : "pumpkin", map: {} };
    if (item.id === "lantern") return { name: "lantern", map: { B: c1, A: "#fff2a8" } };
    if (item.id === "xtree") return { name: "xtree", map: { B: c1, C: c2 }, outline: true };
    if (item.id === "presents") return { name: "presents", map: { B: c1, C: c2 } };
    if (item.id === "lights") return { name: "lightsicon", map: {} };
    if (item.id === "xtree") return i % 3 === 1 ? { name: "xtree2", map: { B: c1, C: c2 }, outline: true } : i % 3 === 2 ? { name: "xtree3", map: { B: c1, C: c2 }, outline: true } : { name: "xtree", map: { B: c1, C: c2 }, outline: true };
    if (item.id === "snowman") { const kinds = ["snowman", "snowman_wink", "snowman_beanie", "snowman_shades", "snowman_broom"];
      return { name: aid === "gate" ? "snowman_broom" : kinds[i % kinds.length], map: { H: c1, S: c2 } }; }
    if (item.id === "candles") return i % 3 === 2 ? { name: "xlantern_a", frames: ["xlantern_a", "xlantern_b"], map: { B: c1 } } : { name: "candles_a", frames: ["candles_a", "candles_b"], map: { B: i % 2 ? "#ffffff" : c1 } };
    if (item.id === "cane") return { name: "cane", map: { R: ["#d94848", "#3fa04a", "#3a8fd0"][i % 3] } };
    if (item.id === "special") { const x = XSPECIAL[aid] || XSPECIAL.penguin;
      if (x.frames) return { name: x.frames[0], map: {} };
      if (x.wreath) return { name: "wreath4", map: {} };
      if (x.balls) return { name: "xball", map: { B: "#e8475f" } };
      if (x.bell) return { name: "bell", map: {} };
      return { name: x.sprite, map: {} }; }
    if (item.id === "ghost") return GHOSTS[aid] || { name: "ghost", map: {} };
    return { name: item.id, map: {} };
  },
  decoIcon(item, aid) {
    const v = this.decoVariant(item, aid), src = Pix.variant(v.name, v.map, v.outline);
    const c = document.createElement("canvas"); c.width = src.width; c.height = src.height; c.getContext("2d").drawImage(src, 0, 0);
    c.className = "px-icon"; return c;
  },
  paintDeco(el, a) {
    this.seasonDecos().forEach(item => {
      if (!this.hasDeco(item.id, a.id)) return;
      if (item.slot === "fence") return this.paintLights(el, a);
      if (item.id === "special") return this.paintSpecial(el, a);
      if (item.id === "cane" && (a.id === "owl" || a.id === "zebra")) return; // Eule: Sitzstange wird zur Zuckerstange · Zebra: die Kratzbürste
      const xp = XMAS_POS[a.id] && XMAS_POS[a.id][item.id];
      if (xp) {
        const v = this.decoVariant(item, a.id);
        if (v.frames) return this.paintFlicker(el, v, xp, 64, 44, "deco deco-" + item.id);
        el.appendChild(Pix.elVar(v.name, v.map, v.outline, "deco deco-" + item.id, xp[0], xp[1], 64, 44));
        return;
      }
      if (XMAS_SLOTS[item.slot]) {
        const pos = (XMAS_SLOT_FIX[a.id] && XMAS_SLOT_FIX[a.id][item.slot]) || XMAS_SLOTS[item.slot], v = this.decoVariant(item, a.id);
        if (v.frames) return this.paintFlicker(el, v, pos, 64, 44, "deco deco-" + item.id);
        el.appendChild(Pix.elVar(v.name, v.map, v.outline, "deco deco-" + item.id, pos[0], pos[1], 64, 44));
        return;
      }
      const pos = (DECO_SLOT_FIX[a.id] && DECO_SLOT_FIX[a.id][item.slot]) || DECO_SLOTS[item.slot];
      const v = this.decoVariant(item, a.id);
      el.appendChild(Pix.elVar(v.name, v.map, v.outline, "deco deco-" + item.id + (item.id === "ghost" ? " g-" + a.id : ""), pos[0], pos[1], 64, 44));
    });
  },
  /* Flackern: zwei Bilder wechseln sich ab (Kerzen, Laterne, Iglu) */
  paintFlicker(el, v, pos, W, H, cls) {
    v.frames.forEach((f, k) => el.appendChild(Pix.elVar(f, v.map, v.outline, cls + " flick f" + k, pos[0], pos[1], W, H)));
  },
  /* Der Tiger spielt im Dezember mit dem rot-weißen Wollknäuel statt mit dem normalen */
  xmasToy(id) { return id === "tiger" && this.hasDeco("special", "tiger") && this.seasonDecos().some(d => d.id === "special"); },
  xmasBrush(id) { return id === "zebra" && this.hasDeco("cane", "zebra") && this.seasonDecos().some(d => d.id === "cane"); },
  paintSpecial(el, a) {
    const x = XSPECIAL[a.id]; if (!x) return;
    if (x.toy) return;                                                  // das Knäuel kommt nur mit dem Spielzeug (wenn es heute erspielt ist)
    if (x.frames) return this.paintFlicker(el, { frames: x.frames, map: {} }, x.pos, 64, 44, "deco deco-special");
    if (x.balls) return x.balls.forEach(([bx, by, c], k) => el.appendChild(Pix.elVar("xball", { B: c }, false, "deco deco-special x-bob b" + k, bx, by, 64, 44)));
    if (x.wreath) return el.appendChild(Pix.elVar("wreath" + this.adventCandles(), {}, false, "deco deco-special x-glow", x.pos[0], x.pos[1], 64, 44));
    el.appendChild(Pix.elVar(x.sprite, {}, !!x.outline, "deco deco-special " + (x.cls || ""), x.pos[0], x.pos[1], 64, 44));
    if (x.bell) el.appendChild(Pix.elVar("bell", {}, false, "deco deco-special x-swing", x.bell[0], x.bell[1], 64, 44));
  },
  /* Lichterkette am Zaun: zwei Lampen-Gruppen blinken abwechselnd */
  paintLights(el, a) {
    const i = Math.max(0, ANIMALS.findIndex(x => x.id === a.id));
    const spots = [];
    for (let x = 3; x <= 60; x += 3) spots.push([x, 3 + (x % 6 === 0 ? 1 : 0)]);
    for (let x = 3; x <= 24; x += 3) spots.push([x, 38]);
    for (let x = 39; x <= 60; x += 3) spots.push([x, 38]);
    const wire = document.createElement("canvas"); wire.width = 64; wire.height = 44; wire.className = "bg";
    const gw = wire.getContext("2d"); gw.fillStyle = "#2f5a2a";
    spots.forEach(([x, y], k) => { const nx = spots[k + 1]; if (nx && nx[1] === y || (nx && Math.abs(nx[1] - y) === 1)) { if (nx[0] > x) gw.fillRect(x, y, nx[0] - x, 1); } });
    el.appendChild(wire);
    [0, 1].forEach(grp => {
      const c = document.createElement("canvas"); c.width = 64; c.height = 44; c.className = "bg lights l" + grp;
      const g = c.getContext("2d");
      spots.forEach(([x, y], k) => { if (k % 2 !== grp) return; g.fillStyle = DECO_COLORS[(k + i) % DECO_COLORS.length]; g.fillRect(x, y, 1, 2); });
      el.appendChild(c);
    });
  },
  /* Gratis-Wetter der Jahreszeit */
  paintWeather(el, big) {
    const w = this.season().weather; if (!w) return;
    const cols = { leaves: ["#d9822b", "#c0392b", "#e8b04a", "#8a5a32"], snow: ["#ffffff"], petals: ["#ffb3c8", "#ffffff", "#ffd6e5"],
      sparkles: ["#fff2a8", "#ffffff"], fluff: ["#ffffff", "#f3f3f3"] }[w];
    const box = document.createElement("div"); box.className = "weather w-" + w;
    for (let i = 0; i < (big ? 14 : 7); i++) {
      const p = document.createElement("i");
      p.style.left = (Math.random() * 96).toFixed(1) + "%"; p.style.top = (w === "fluff" ? 10 + Math.random() * 70 : -8) + "%";
      p.style.animationDuration = (3 + Math.random() * 3).toFixed(2) + "s"; p.style.animationDelay = (-Math.random() * 6).toFixed(2) + "s";
      p.style.background = U.pick(cols);
      box.appendChild(p);

    el.appendChild(box);
  },
  decoCard() {
    const s = this.season(), items = this.seasonDecos(), A = this.A;

          ${has ? `<span class="have">✓</span>` : `<button class="buy" data-decobuy="${aid}" ${A.wallet >= it.price ? "" : "disabled"}>⭐ ${it.price}</button>`}</div>`; }).join("")}

      <p class="dlg-title">🧹 Mio helps!</p><p class="dlg-en">Mio hilft!</p>
      <p>Du hast insgesamt ${this.A.jokerAwarded * JOKER_XP} XP gesammelt. Dafür bekommst du einen <b>Joker</b>: Mio putzt ein Gehege für dich.</p>
      <p class="small"><em class="en-inline">You get a joker: Mio cleans one enclosure for you.</em></p>
      <p class="small">Du hast jetzt ${this.A.jokers} Joker. Tipp auf ein schmutziges Gehege und dann auf „Mio hilft“.</p>
      <button class="btn primary big" data-close>Super!</button>`,
      d => { d.dataset.rerender = "1"; const b = Pix.icon("broom"); b.className = "joker-broom"; d.querySelector("[data-broom]").appendChild(b); });
  },
  useJoker(a, d) {
    const A = this.A;
    if (!(A.jokers > 0) || this.dirt(a.id) === 0 || this.sad(a.id)) return;
    // sofort speichern, die Animation ist nur Anzeige
    // Mio schenkt genau die XP, die das Putzen gebracht hätte (1 oder 5 pro Aufgabe)
    const gift = ZOO.CLEAN_TASKS * (this.hasFriend(a.id) ? ENC_XP_TWO.correct : ENC_XP_ONE.correct);
    A.jokers--; A.animals[a.id].clean = U.today(); Store.save(); this.bump("jokersUsed");
    Plan.addXP(gift); this.checkZoo();
    d.dataset.rerender = "1";
    const sc = d.querySelector("[data-bigscene]"), row = d.querySelector("[data-cleanrow]");
    sc.scrollIntoView({ block: "nearest", behavior: "smooth" });
    row.innerHTML = `<div class="row-txt">🧹 ${this.bi("Mio putzt …", "Mio is cleaning …")}</div>`;
    const dirt = sc.querySelector("canvas.dirt"); if (dirt) dirt.classList.add("sweep");
    const run = document.createElement("div"); run.className = "mio-run";
    run.innerHTML = Mio.svg("cheer");
    const br = Pix.icon("broom"); br.className = "run-broom"; run.appendChild(br);
    sc.appendChild(run);
    Sound.play("sweep");
    run.addEventListener("animationend", e => {
      if (e.target !== run || !sc.isConnected) return;
      run.remove();
      this.scene(sc, a, true); this.hearts(sc, 5);
      Sound.play("combo"); Confetti.burst(60, "stars");
      row.innerHTML = `<div class="row-txt">🧹 ${this.bi(`Sauber ✨ – danke, Mio! Mio schenkt dir ${gift} XP.`, `Clean – thank you, Mio! Mio gives you ${gift} XP.`)}</div>`;
      this.toyRow(a, d);
    });
  },
  checkTrophies() {
    const A = this.A, t = U.today();
    let changed = false;
    TROPHIES.forEach(tr => {
      if (A.trophies[tr.id]) return;
      let ok = false; try { ok = tr.test(this); } catch (e) { ok = false; }
      if (ok) { A.trophies[tr.id] = t; A.trophyQueue.push(tr.id); changed = true; }
    });
    if (changed) Store.save();
  },
  trophyEl(tr, locked, size) { const c = Pix.trophy(tr.shape, tr.metal, locked); c.style.width = size || "56px"; return c; },
  dayText(d) { return new Date(d * 864e5).toLocaleDateString("de-DE", { timeZone: "UTC", day: "numeric", month: "long", year: "numeric" }); },
  trophyPopup() {
    const id = this.A.trophyQueue.shift(); Store.save();

    this.dialog(`<p class="dlg-title">🏆 Neuer Pokal!</p><div class="tro-big" data-trobig></div>
      <p class="tro-name">${U.esc(tr.name)}</p><p>${U.esc(tr.desc)}</p>
      <button class="btn primary big" data-close>Super!</button><button class="btn ghost" data-togallery>Alle Pokale ansehen</button>`,
      d => { d.dataset.rerender = "1"; d.querySelector("[data-trobig]").appendChild(this.trophyEl(tr, false, "120px"));
        d.querySelector("[data-togallery]").onclick = () => { d.hidden = true; this.view = "trophies"; this.render(); }; });
  },
  trophiesView() {
    const A = this.A, got = TROPHIES.filter(t => A.trophies[t.id]).length;
    return `<header class="top"><div class="brand">Deine Pokale</div><div class="pill gold">⭐ ${A.wallet} XP</div>
      <button class="icon" data-go="settings" aria-label="Einstellungen">⚙️</button></header>
      <div class="card tro-head"><b>🏆 ${got} von ${TROPHIES.length} Pokalen</b>
        <div class="progress"><div style="width:${Math.round(100 * got / TROPHIES.length)}%"></div></div></div>
      <div class="card babies-card"><b>🍼 Tierbabys · ${this.babyCount()} von ${BABIES.length}</b>
        <p class="small">Ein Baby zieht nur in ein Gehege, in dem schon zwei Tiere wohnen.</p>
        ${BABIES.map(b => { const born = this.hasBaby(b.id), wait = this.babyWaiting(b.id), here = A.unlocked.includes(b.id), show = born || wait || here;
          return `<div class="baby-row ${born ? "born" : show ? "next" : "later"}"><span class="baby-ico" data-babyico="${show ? b.id : ""}">${show ? "" : "❔"}</span>
            <div class="baby-txt"><b>${born ? b.name : wait ? b.name + " – wartet" : here ? b.name : "Überraschung"}</b>
            <span>${born ? "ist da! 💕" : wait ? `wartet auf ${FRIENDS[b.id].ein} 🐾` : here ? this.babyGoalText(b) + (this.hasFriend(b.id) ? "" : " · 🐾 zwei Tiere nötig") : (b.words ? `${b.words} Wörter · ` : "") + BABY_GOALS[b.k].de(b.n)}</span></div></div>`; }).join("")}</div>
      <div class="tro-grid">${TROPHIES.map(t => `<button class="tro ${A.trophies[t.id] ? "got" : "locked"}" data-trophy="${t.id}">
        <span class="tro-ico" data-troico="${t.id}"></span><span class="tro-label">${A.trophies[t.id] ? U.esc(t.name) : "?"}</span></button>`).join("")}</div>`;
  },
  openTrophy(id) {

      <button class="btn primary big" data-close>OK</button>`,

  },

  /* Traurig: einen ganzen Tag nicht gefüttert oder nicht sauber gemacht – muss erst getröstet werden */
  sad(id) { return (this.hunger(id) >= 2 || this.dirt(id) >= 2) && this.A.animals[id].comforted !== U.today(); },
  /* Nach langer Pause (Ferien) hat Mio auf die Tiere aufgepasst: niemand weint */
  checkHoliday() {
    const A = this.A, t = U.today();
    if (A.lastVisit != null && t - A.lastVisit >= ZOO.HOLIDAY_DAYS) {
      A.unlocked.forEach(id => { A.animals[id].fed = t - 1; A.animals[id].clean = t - 1; });
      A.event = null; A.lastEventRoll = t;
      this.holidayMsg = true;
    }
    A.lastVisit = t; Store.save();
  },
  /* Herzen: ❤️ = gefüttert + sauber (+ kein Ereignis), 💖 = dazu heute gespielt */
  heart1(id) { const ev = this.A.event; return this.hunger(id) === 0 && this.dirt(id) === 0 && !(ev && ev.animal === id); },
  heart2(id) { return this.heart1(id) && this.A.animals[id].toy === U.today(); },
  played(id) { return this.A.animals[id].toy === U.today(); },
  zooLevel() {
    const ids = this.A.unlocked;
    if (!ids.length) return 0;
    if (ids.every(id => this.heart2(id))) return 2;
    if (ids.every(id => this.heart1(id))) return 1;
    return 0;
  },
  /* nach jeder Aktion: Ist der Zoo heute glücklich / superglücklich geworden? */
  checkZoo() {
    const A = this.A, t = U.today(), lvl = this.zooLevel(), prev = A.days[t] || 0;
    if (lvl > prev) {
      A.days[t] = lvl;
      if (prev < 1) Plan.addXP(ZOO.HAPPY_BONUS);
      if (lvl === 2) Plan.addXP(ZOO.POWER_BONUS);
      if (lvl === 2) this.bump("powerDays");
      if (prev < 1 && this.zooStreak(1) % 7 === 0) this.bump("happyWeeks");
      this.pendingZoo = lvl;
      Object.keys(A.days).forEach(d => { if (+d < t - 90) delete A.days[d]; });
      Store.save();
    }
  },
  zooStreak(level) {
    const A = this.A, t = U.today();
    let d = (A.days[t] || 0) >= level ? t : t - 1, n = 0;
    while ((A.days[d] || 0) >= level) { n++; d--; }
    return n;
  },
  rollEvent() {
    const A = this.A, t = U.today();
    if (A.lastEventRoll === t) return;
    A.lastEventRoll = t;
    if (!A.event && Plan.learnedWords().length >= ZOO.EVENT_MIN_WORDS && Math.random() < ZOO.EVENT_CHANCE) this.makeEvent();
    Store.save();
  },
  makeEvent() {
    const A = this.A;
    const animal = U.pick(A.unlocked), keys = Object.keys(EVENTS);
    const own = keys.filter(k => EVENTS[k].only === animal), gen = keys.filter(k => !EVENTS[k].only);
    A.event = { type: own.length && Math.random() < 0.6 ? U.pick(own) : U.pick(gen), animal, day: U.today() };
    Store.save();
  },
  foodNeeded() { return new Set(this.A.unlocked.map(id => this.animal(id).food)); },

  hint() {
    const A = this.A;
    if (this.donePacks() < 1) return { mood: "idle", en: "Let's learn!", de: "Lerne im Shop dein erstes Päckchen fertig. Dann kannst du im Zoo putzen, trösten und Spielzeug erspielen." };
    const sadId = A.unlocked.find(id => this.sad(id));
    if (sadId) { const a = this.animal(sadId); return { mood: "encourage", en: "Oh no, someone is sad!", de: `${a.der} ist traurig und weint. Tipp auf das Gehege und tröste ${a.sie}.` }; }
    if (A.event) { const a = this.animal(A.event.animal); return { mood: "encourage", en: "Oh no!", de: `${EVENTS[A.event.type].title} (${a.geh}-Gehege) Hilf mit!` }; }
    const hungry = A.unlocked.filter(id => this.hunger(id) > 0);
    const canFeed = hungry.find(id => A.inv[this.animal(id).food] > 0);
    if (canFeed) { const a = this.animal(canFeed); return { mood: "idle", en: "Feeding time!", de: `${a.der} hat Hunger. Du hast ${FOODS[a.food].name} – tipp auf das Gehege!` }; }
    if (hungry.length) { const a = this.animal(hungry[0]); return { mood: "idle", en: "Let's go shopping!", de: `${a.der} hat Hunger. Löse im Shop Aufgaben und kauf ${FOODS[a.food].name}.` }; }
    const dirty = A.unlocked.find(id => this.dirt(id) > 0);
    if (dirty) return { mood: "idle", en: "Time to clean up!", de: `Das ${this.animal(dirty).geh}-Gehege ist schmutzig. Beim Putzen wiederholst du Wörter.` };
    const noToy = A.unlocked.filter(id => !this.played(id));
    if (noToy.length) { const a = this.animal(noToy[0]);
      return { mood: "cheer", en: "Happy zoo! Go for power?", de: `Alle Tiere sind glücklich ❤️. Erspiel am Gehege jedem Tier sein Spielzeug für den Power-Zoo 💖 – zum Beispiel ${TOYS[a.id].name} für ${a.fuer}.` }; }
    return { mood: "party", en: "POWER ZOO!", de: Plan.nextPack(A.setId) ? "Im Shop warten neue Wörter auf dich." : "Super gemacht! Schau morgen wieder vorbei." };
  },

  /* ---------- Darstellung ---------- */
  header() {
    return `<header class="top">
      <div class="brand ${this.A.kidName ? "long" : ""}">${U.esc(this.zooTitle())}</div>
      <div class="pill gold" title="XP zum Einkaufen">⭐ ${this.A.wallet} XP</div>
      <div class="pill fire">🔥 ${Plan.streak()}</div>
      <button class="icon" data-go="settings" aria-label="Einstellungen">⚙️</button>
    </header>`;
  },
  nav() {
    return `<nav class="bottom-nav"><button class="${this.view === "zoo" ? "on" : ""}" data-go="zoo">🦒 Zoo</button>
      <button class="${this.view === "shop" ? "on" : ""}" data-go="shop">🏪 Shop</button>
      <button class="${this.view === "trophies" ? "on" : ""}" data-go="trophies">🏆 Pokale</button></nav>`;
  },
  invBar() {

      <span class="inv-label">Vorrat</span></div>`;

  render(keep) {

    this.checkJokers();
    this.checkBabies();
    this.checkTrophies();
    this.advanceGate();
    const app = document.getElementById("app");
