  --hl: #FFE27A; --say-bg: #F6DDB0; --sel-bg: #FDEFD3; --tricky: #A3197A; --tricky-bg: #FFD9F0; --hint-bg: #FFF1BF;
  --wood: #8B5A2B; --wood-dark: #5E3A1A;
}
/* ===== Gemeinsames Aussehen (Farben über Variablen je App) ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 20px; line-height: 1.35;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
input { font: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }

.btn { display: block; width: 100%; border: none; border-radius: var(--radius); padding: 14px 18px; font-weight: 800;
  background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line); margin-top: 10px; transition: transform .06s; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.big { min-height: 62px; font-size: 22px; }
.btn.primary { background: var(--primary); color: #fff; box-shadow: 0 5px 0 var(--primary-dark); }
.btn.warm { background: var(--bad); color: #fff; box-shadow: 0 5px 0 var(--bad-dark); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }

/* ===== Lektion ===== */
#lesson { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top); }
#lesson[hidden] { display: none; }
body.in-lesson { overflow: hidden; }
.ls-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; max-width: 560px; width: 100%; margin: 0 auto; }
.ls-close { border: none; background: none; font-size: 28px; color: var(--muted); width: 44px; height: 44px; padding: 0; }
.ls-bar { flex: 1; height: 18px; background: var(--line); border-radius: 99px; overflow: hidden; }
.ls-fill { height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .35s; }
.ls-xp { font-weight: 800; color: var(--gold); min-width: 64px; text-align: right; }
.ls-body { flex: 1; overflow-y: auto; padding: 4px 16px 20px; max-width: 560px; width: 100%; margin: 0 auto; }
.ls-foot { padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; width: 100%; margin: 0 auto; }
.ls-foot:empty { display: none; }

.badges { margin: 4px 0 10px; }
.badge { display: inline-block; font-size: 16px; font-weight: 800; padding: 5px 12px; border-radius: 99px; }
.badge.review { background: var(--review-bg); color: var(--review); }
.badge.new { background: var(--new-bg); color: var(--new); }
.badge.retry { background: var(--bad-bg); color: var(--bad-dark); }
.badge.spell { background: var(--spell-bg); color: var(--spell); }
.instr { font-size: 24px; font-weight: 800; margin: 6px 0 18px; }

.prompt { background: var(--card); border-radius: var(--radius); padding: 22px 18px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--line);
  display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; text-align: center; }
.big-word { font-size: 34px; font-weight: 800; }
.big-word.de { color: var(--ink); }
.sentence { font-size: 25px; font-weight: 700; line-height: 1.5; }
.sentence.de { font-weight: 600; }
.gap { display: inline-block; min-width: 90px; border-bottom: 4px solid var(--primary); color: transparent; }
.hl { background: var(--hl); padding: 0 6px; border-radius: 8px; }
.help-de { text-align: center; color: var(--muted); margin: -8px 0 16px; font-size: 18px; }

.options { display: grid; gap: 12px; }
.opt { min-height: 62px; border: 3px solid var(--line); background: var(--card); border-radius: var(--radius); font-size: 22px; font-weight: 700;
  padding: 10px 14px; box-shadow: 0 4px 0 var(--line); text-align: center; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 4px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 4px 0 var(--bad); }
.opt:disabled { cursor: default; }

.say { border: none; background: var(--say-bg); border-radius: 50%; width: 52px; height: 52px; font-size: 24px; flex: none;
  box-shadow: 0 3px 0 var(--line); padding: 0; }
.say.small { width: 40px; height: 40px; font-size: 18px; vertical-align: middle; }
.say.huge { width: 110px; height: 110px; font-size: 52px; }
.say.slow { width: 70px; height: 70px; font-size: 32px; }
.listen-row { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 10px 0 18px; }
.tipbtn { display: block; margin: 0 auto 14px; border: none; background: none; color: var(--primary-dark); font-weight: 700; font-size: 17px; text-decoration: underline; }

.type-in { width: 100%; font-size: 28px; padding: 14px 16px; border: 3px solid var(--line); border-radius: var(--radius); background: var(--card);
  color: var(--ink); outline: none; text-align: center; }
.type-in:focus { border-color: var(--primary); }
.type-in.right { border-color: var(--ok); background: var(--ok-bg); }
.type-in.wrong { border-color: var(--bad); background: var(--bad-bg); }

/* Kacheln */
.answer-line { min-height: 74px; border-bottom: 3px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; margin-bottom: 18px; align-items: center; }
.answer-line.right { border-color: var(--ok); } .answer-line.wrong { border-color: var(--bad); }
.placeholder { color: var(--muted); font-size: 17px; }
.tile-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile { border: 3px solid var(--line); background: var(--card); border-radius: 14px; font-weight: 700; box-shadow: 0 4px 0 var(--line); padding: 0 14px; }
.tile.word { min-height: 54px; font-size: 21px; }
.tile.letter { width: 56px; height: 60px; font-size: 28px; padding: 0; }
.tile.used { opacity: .25; box-shadow: none; }
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 4px 0 26px; }
.slot { width: 44px; height: 56px; border: none; border-bottom: 4px solid var(--line); background: var(--card); border-radius: 10px 10px 4px 4px;
  font-size: 28px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.slot.filled { border-bottom-color: var(--primary); }
.slot.fixed { background: transparent; }
.slot.space { width: 18px; background: transparent; border: none; }
.slots.right .slot.filled { border-bottom-color: var(--ok); background: var(--ok-bg); }
.slots.wrong .slot.filled { border-bottom-color: var(--bad); }

.gapword { display: flex; justify-content: center; align-items: flex-end; flex-wrap: wrap; gap: 3px; font-size: 38px; font-weight: 800; margin: 8px 0 10px; }
.gl { padding: 0 1px; }
.gapin { width: 46px; height: 58px; font-size: 32px; font-weight: 800; text-align: center; border: 3px solid var(--primary); border-radius: 10px;
  background: var(--card); color: var(--ink); outline: none; padding: 0; }
.gapin.right { border-color: var(--ok); background: var(--ok-bg); } .gapin.wrong { border-color: var(--bad); background: var(--bad-bg); }

/* Karten zuordnen */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mcol { display: grid; gap: 12px; }
.mcard { min-height: 64px; border: 3px solid var(--line); background: var(--card); border-radius: var(--radius); font-size: 19px; font-weight: 700;
  box-shadow: 0 4px 0 var(--line); padding: 6px 8px; }
.mcard.sel { border-color: var(--primary); background: var(--sel-bg); }
.mcard.done { border-color: var(--ok); background: var(--ok-bg); opacity: .5; box-shadow: none; }
.shake { animation: shake .4s; border-color: var(--bad) !important; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* Neues Wort */
.intro-card { background: var(--card); border-radius: var(--radius); padding: 24px 18px; box-shadow: 0 4px 0 var(--line); text-align: center; }
.intro-word { font-size: 44px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.intro-de { font-size: 26px; color: var(--muted); font-weight: 700; margin: 8px 0 14px; }
.intro-tip { font-size: 17px; color: var(--muted); margin-bottom: 10px; }
.intro-ex { border-top: 2px dashed var(--line); padding-top: 14px; margin-top: 8px; }
.ex-en { font-size: 22px; font-weight: 700; }
.ex-de { font-size: 18px; color: var(--muted); margin-top: 4px; }
.tricky { background: var(--tricky-bg); color: var(--tricky); border-radius: 6px; padding: 0 2px; }
.hint { background: var(--hint-bg); border-radius: 14px; padding: 10px 14px; margin: 12px 0 4px; font-size: 18px; font-weight: 600; text-align: left; }

/* Rückmeldung */
.ls-sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0; animation: up .22s ease-out; box-shadow: 0 -6px 24px rgba(0,0,0,.12); max-height: 75%; overflow-y: auto; }
.ls-sheet[hidden] { display: none; }
.ls-sheet > * { max-width: 528px; margin-left: auto; margin-right: auto; }
.ls-sheet.ok { background: var(--ok-bg); } .ls-sheet.bad { background: var(--bad-bg); }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.sheet-row { display: flex; gap: 12px; align-items: flex-start; }
.sheet-mio { width: 86px; flex: none; }
.sheet-txt { flex: 1; min-width: 0; }
.sheet-title { font-size: 24px; font-weight: 800; }
.ok .sheet-title { color: var(--ok-dark); } .bad .sheet-title { color: var(--bad-dark); }
.sheet-detail { font-size: 19px; margin-top: 4px; }
.gain { font-weight: 800; color: var(--gold); margin-top: 6px; }
.again { margin-top: 8px; font-size: 17px; color: var(--muted); }
.full-sent { font-weight: 700; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spelled { font-size: 28px; font-weight: 800; letter-spacing: 1px; }
.bad .spelled .bad, .spelled .bad { background: var(--bad); color: #fff; border-radius: 5px; padding: 0 2px; }
.spelled .good { background: var(--ok); color: #fff; border-radius: 5px; padding: 0 2px; }
.cmp-row { margin: 4px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cmp-l { font-size: 16px; color: var(--muted); width: 64px; }
.note { font-size: 16px; margin-top: 6px; }

/* Lektionsende */
.finish { text-align: center; padding-top: 10px; }
.finish-mio { width: 180px; margin: 0 auto; }
.finish h2 { font-size: 32px; margin: 8px 0 18px; color: var(--primary-dark); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--card); border-radius: var(--radius); padding: 14px 6px; box-shadow: 0 3px 0 var(--line); }
.stat b { display: block; font-size: 30px; color: var(--primary-dark); }
.stat span { font-size: 15px; color: var(--muted); font-weight: 700; }
.refreshed { margin-top: 18px; text-align: left; }
.ref-title { font-weight: 800; margin-bottom: 8px; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--review-bg); color: var(--review); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 17px; }

/* Dialog */
.ls-dialog, .dialog { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 80; padding: 20px; }
.ls-dialog[hidden], .dialog[hidden] { display: none; }
.dlg-box { background: var(--bg); border-radius: 24px; padding: 20px; max-width: 400px; width: 100%; text-align: center; }
.dlg-box .mio { width: 110px; }
.dlg-title { font-size: 24px; font-weight: 800; margin: 6px 0; }

/* Mio */
.mio { width: 100%; height: auto; display: block; overflow: visible; }
.mio .eyes-happy, .mio .mouth-open, .mio .brows { display: none; }
.mio.cheer .eyes-open, .mio.party .eyes-open { display: none; }
.mio.cheer .eyes-happy, .mio.party .eyes-happy, .mio.cheer .mouth-open, .mio.party .mouth-open { display: inline; }
.mio.cheer .mouth-smile, .mio.party .mouth-smile { display: none; }
.mio.encourage .brows { display: inline; }
.mio .mio-head, .mio .mio-tail { transform-box: fill-box; }
.mio .mio-head { transform-origin: 50% 90%; }
.mio .mio-tail { transform-origin: 0% 100%; animation: wag 1.6s ease-in-out infinite; }
.mio.idle { animation: breathe 3s ease-in-out infinite; transform-origin: 50% 100%; }
.mio.cheer { animation: hop .6s ease-out 2; transform-origin: 50% 100%; }
.mio.party { animation: hop .55s ease-out infinite; transform-origin: 50% 100%; }
.mio.party .mio-tail { animation: wag .35s ease-in-out infinite; }
.mio.encourage .mio-head { animation: tilt 1.4s ease-in-out 1 forwards; }
@keyframes wag { 50% { transform: rotate(-12deg); } }
@keyframes breathe { 50% { transform: scale(1.03, .97); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-16%) scale(1.04); } 60% { transform: translateY(0) scale(1.06, .94); } }
@keyframes tilt { 30% { transform: rotate(-9deg); } 100% { transform: rotate(-6deg); } }

.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

/* Gemeinsame Bausteine der Startseiten */
.bubble { position: relative; background: var(--card); border-radius: 18px; padding: 12px 16px; font-weight: 700; box-shadow: 0 3px 0 var(--line); }
.progress { height: 14px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ok); border-radius: 99px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px; border-bottom: 2px solid var(--line); font-weight: 700; }
.switch { width: 64px; height: 36px; border-radius: 99px; border: none; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--ok); } .switch.on::after { left: 32px; }
@media (prefers-reduced-motion: reduce) { .mio, .mio * { animation: none !important; } }

/* ===== PWA: Hinweise, Update, Sicherung ===== */
.pwa-banner { position: fixed; left: 0; right: 0; top: 0; z-index: 60; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; pointer-events: none; }
.pwa-inner { max-width: 540px; margin: 0 auto; background: var(--card); border: 3px solid var(--primary); border-radius: 16px; padding: 12px 40px 12px 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18); position: relative; pointer-events: auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; animation: down .25s ease-out; }
@keyframes down { from { transform: translateY(-120%); } to { transform: none; } }
.pwa-txt { flex: 1 1 220px; font-size: 17px; line-height: 1.35; }
.pwa-share { display: inline-block; border: 2px solid var(--ink); border-radius: 4px; padding: 0 4px; font-size: 14px; line-height: 1.2; }
.pwa-btn { border: none; background: var(--primary); color: #fff; font-weight: 800; border-radius: 12px; padding: 10px 14px; font-size: 17px; box-shadow: 0 3px 0 var(--primary-dark); }
.pwa-x { position: absolute; right: 6px; top: 6px; border: none; background: none; font-size: 20px; color: var(--muted); width: 32px; height: 32px; padding: 0; }
body.in-lesson .pwa-banner { display: none; }
.bk-title { font-weight: 800; font-size: 20px; margin: 0 0 4px; }
.bk-code { width: 100%; min-height: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; border: 2px solid var(--line); border-radius: 10px;
  padding: 8px; margin-top: 10px; background: #fff; color: var(--ink); word-break: break-all; resize: vertical; }
.bk-err { color: var(--bad-dark); font-weight: 700; min-height: 1em; }

/* Stimmenauswahl */
.voice-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line);
  border-radius: 12px; padding: 10px 12px; margin-top: 8px; min-height: 58px; }
.voice-row.on { border-color: var(--ok); background: var(--ok-bg); }
.vr-check { width: 22px; font-weight: 800; color: var(--ok-dark); font-size: 20px; text-align: center; }
.vr-txt { flex: 1; display: flex; flex-direction: column; }
.vr-txt b { font-size: 18px; } .vr-txt span { font-size: 14px; color: var(--muted); }
.vr-play { width: 38px; height: 38px; border-radius: 50%; background: var(--say-bg); display: flex; align-items: center; justify-content: center; font-size: 15px; }

.ver { font-size: 15px; font-weight: 700; color: var(--muted); margin-left: 6px; font-family: var(--font); }

/* zweite Zeile im Button (z. B. Buchseite des Päckchens) */
.btn .btn-sub { display: block; font-size: 16px; font-weight: 700; opacity: .85; margin-top: 2px; }

body { background: var(--bg) repeating-linear-gradient(0deg, transparent 0 22px, rgba(139,90,43,.05) 22px 24px); }
.wrap { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
.btn { border: 3px solid var(--wood-dark); box-shadow: 0 4px 0 var(--wood-dark); font-family: var(--pixel); font-weight: 700; letter-spacing: .3px; }
.btn.primary { border-color: #2E5A18; box-shadow: 0 5px 0 #2E5A18; }
.btn.warm { border-color: #7d4510; box-shadow: 0 5px 0 #7d4510; }
.btn.ghost { border: none; box-shadow: none; }
.instr, .sheet-title, .finish h2, .dlg-title { font-family: var(--pixel); font-weight: 700; }
.opt, .tile, .mcard, .prompt, .intro-card, .stat, .slot { border-color: var(--line); }
.prompt, .intro-card, .stat { border: 3px solid var(--line); }
.ls-sheet { border-top: 4px solid var(--wood); }
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.brand { flex: 1; font-family: var(--pixel); font-weight: 700; font-size: 26px; color: var(--wood-dark); }
.pill { font-weight: 800; background: var(--card); border: 3px solid var(--line); border-radius: 8px; padding: 3px 9px; font-size: 17px; white-space: nowrap; }
.pill.gold { color: var(--gold); } .pill.fire { color: #D9480F; }
.icon { border: 3px solid var(--line); background: var(--card); border-radius: 8px; width: 44px; height: 44px; font-size: 20px; padding: 0; }
.test-banner { background: #FFF1BF; border: 2px dashed var(--line); border-radius: 8px; padding: 6px 12px; font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 10px; }
.hero { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
.hero-mio { width: 96px; flex: none; }
.hero .bubble { flex: 1; font-size: 17px; font-weight: 600; border: 3px solid var(--line); box-shadow: none; }
.hero .bubble b { font-family: var(--pixel); font-size: 20px; color: var(--wood-dark); }
.card { background: var(--card); border: 3px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: 0 4px 0 var(--line); }
.card-title { font-family: var(--pixel); font-weight: 700; font-size: 22px; color: var(--wood-dark); }
.small { font-size: 16px; color: var(--muted); }
.sc-sub { color: var(--muted); font-weight: 700; font-size: 16px; margin: 6px 0 2px; }
.done-box { background: var(--ok-bg); color: var(--ok-dark); font-weight: 800; border-radius: 8px; padding: 12px; text-align: center; margin-top: 10px; }
.test-tools { background: #FFF9E6; border-style: dashed; }

.inv { display: flex; align-items: center; gap: 8px; background: var(--card); border: 3px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 12px; }
.inv-item { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 19px; background: #F6E6C4; border-radius: 6px; padding: 2px 8px; }
.inv-item.dim { opacity: .35; }
.inv-label { margin-left: auto; font-family: var(--pixel); color: var(--muted); font-size: 16px; }
.px-icon { image-rendering: pixelated; width: 28px; height: auto; display: inline-block; vertical-align: middle; }

.zoo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.enc { display: block; padding: 5px; border: 3px solid var(--wood-dark); background: var(--wood); border-radius: 8px; box-shadow: 0 4px 0 var(--wood-dark); text-align: left; }
.enc:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
.enc.alert { animation: alertPulse 1.2s steps(2) infinite; }
@keyframes alertPulse { 50% { border-color: #E03131; box-shadow: 0 4px 0 #E03131; } }
.enc.locked { background: #b9a487; border-color: #8c7a62; box-shadow: 0 4px 0 #8c7a62; }
.enc-name { display: flex; justify-content: space-between; align-items: center; color: #FFF3DA; font-family: var(--pixel); font-weight: 700; font-size: 18px; padding: 4px 3px 0; }
.enc-ico { font-size: 15px; letter-spacing: 1px; }
.scene { position: relative; isolation: isolate; width: 100%; aspect-ratio: 64 / 44; overflow: hidden; border-radius: 4px; background: #6abe4b; }
.scene canvas.bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.scene canvas.px { position: absolute; height: auto; image-rendering: pixelated; }
.locked-scene { background: repeating-linear-gradient(45deg, #a8957a 0 8px, #b3a084 8px 16px); display: flex; align-items: center; justify-content: center; font-size: 34px; }
.px.animal.happy { animation: bob .8s steps(2) infinite; }

/* z-index folgt der Höhe im Gehege: weiter unten = weiter vorn (wie bei den Tieren) */
@keyframes mioRun {
  0% { left: -20%; top: 50%; transform: scaleX(1); z-index: 43; } 32% { left: 82%; top: 28%; transform: scaleX(1); z-index: 33; }
  33% { left: 82%; top: 28%; transform: scaleX(-1); z-index: 33; } 65% { left: 2%; top: 58%; transform: scaleX(-1); z-index: 46; }
  66% { left: 2%; top: 58%; transform: scaleX(1); z-index: 46; } 100% { left: 105%; top: 40%; transform: scaleX(1); z-index: 38; } }
canvas.dirt.sweep { animation: sweepOut 2.6s linear forwards; }
@keyframes sweepOut { 0% { opacity: 1; } 85% { opacity: 0; } 100% { opacity: 0; } }
.joker-pic { position: relative; width: 120px; margin: 0 auto; }

/* Deko und Wetter */
.scene canvas.lights { animation: blink 1.2s steps(1) infinite; }

@keyframes blink { 50% { opacity: .25; } }
.px.deco-ghost { animation: ghostFloat 2.4s ease-in-out infinite; }
@keyframes ghostFloat { 50% { transform: translateY(-14%); } }
.px.deco-ghost.g-penguin { animation: gSlide 3.2s ease-in-out infinite; }
@keyframes gSlide { 0%, 50%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(130%) rotate(14deg); } 75% { transform: translateX(-130%) rotate(-14deg); } }
.px.deco-ghost.g-seal { animation: gDive 3.6s ease-in-out infinite; }
@keyframes gDive { 0%, 100% { transform: translateY(0); opacity: 1; } 30% { transform: translateY(80%); opacity: 0; } 55% { transform: translateY(80%); opacity: 0; }
  68% { transform: translateY(-35%); opacity: 1; } 80% { transform: translateY(0); } }
.px.deco-ghost.g-owl { animation: gBoo 3s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes gBoo { 0%, 55%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-10%) scale(1); } 65% { transform: scale(1.6); } 75% { transform: scale(1.5); } 85% { transform: scale(1); } }
.px.deco-ghost.g-elephant { animation: gLoop 3s linear infinite; }
@keyframes gLoop { from { transform: rotate(0) translateX(70%) rotate(0); } to { transform: rotate(360deg) translateX(70%) rotate(-360deg); } }
.px.deco-ghost.g-zebra { animation: gHop .9s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes gHop { 0%, 100% { transform: translateY(0) scale(1, 1); } 35% { transform: translateY(-45%) scale(.9, 1.1); } 65% { transform: translateY(0) scale(1.15, .85); } }
.px.deco-ghost.g-tiger { animation: gSpin 2.4s ease-in-out infinite; }
@keyframes gSpin { 0%, 100% { transform: scaleX(1) translateY(0); } 25% { transform: scaleX(-1) translateY(-12%); } 50% { transform: scaleX(1) translateY(0); } 75% { transform: scaleX(-1) translateY(-12%); } }
.px.deco-ghost.g-giraffe { animation: gStretch 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes gStretch { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.4); } }
.px.deco-lantern { filter: drop-shadow(0 0 2px rgba(255,230,120,.9)); }
.weather { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.weather i { position: absolute; display: block; width: 2.8%; aspect-ratio: 1; }
.w-snow i { animation: wFall linear infinite; opacity: .9; }
.w-leaves i { width: 3.6%; aspect-ratio: 1.6; animation: wLeaf linear infinite; }
.w-petals i { width: 3.2%; aspect-ratio: 1.4; animation: wLeaf linear infinite; border-radius: 40%; }
.w-sparkles i { width: 2.6%; animation: wSpark ease-in-out infinite; }
.w-fluff i { width: 2.6%; border-radius: 50%; animation: wDrift linear infinite; opacity: .85; }
@keyframes wFall { from { transform: translateY(0); } to { transform: translateY(3200%); } }
@keyframes wLeaf { 0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(150%, 700%) rotate(90deg); } 50% { transform: translate(-100%, 1400%) rotate(180deg); }
  75% { transform: translate(150%, 2100%) rotate(270deg); } 100% { transform: translate(0, 2800%) rotate(360deg); } }
@keyframes wSpark { 0%, 100% { opacity: 0; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-300%); } }
@keyframes wDrift { from { transform: translate(0, 0); } to { transform: translate(1800%, -400%); } }

@keyframes b-waddle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

@keyframes b-wobble { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } 70% { transform: rotate(7deg) translateY(-12%); } }

/* ---------- Hilfsfunktionen ---------- */
const U = {
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); },
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  pick(a) { return a[Math.floor(Math.random() * a.length)]; },
  today() { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); },
  chunk(a, n) { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; },
  norm(s) {
    return String(s).toLowerCase().replace(/[’`´]/g, "'").replace(/[.,!?;:"()]/g, " ").replace(/\s+/g, " ").trim();
  },
  stripArticle(s) { return s.replace(/^(to|a|an|the) /, ""); },
  lev(a, b) {
    const m = a.length, n = b.length, d = [];
    for (let i = 0; i <= m; i++) { d[i] = [i]; }
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d;
  },
  /* Vergleicht Antwort und Ziel Buchstabe für Buchstabe.
     Liefert: welche Buchstaben der Antwort falsch sind, welche im Ziel fehlen/anders sind */
  diff(ans, target) {
    const a = ans.toLowerCase(), b = target.toLowerCase();
    const d = U.lev(a, b);
    let i = a.length, j = b.length;
    const badA = new Set(), badB = new Set();
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && a[i - 1] === b[j - 1] && d[i][j] === d[i - 1][j - 1]) { i--; j--; }
      else if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + 1) { badA.add(i - 1); badB.add(j - 1); i--; j--; }
      else if (i > 0 && d[i][j] === d[i - 1][j] + 1) { badA.add(i - 1); i--; }
      else { badB.add(j - 1); if (j > 0) j--; else i--; }
    }
    return { badA, badB, dist: d[a.length][b.length] };
  },
  /* "fr[ie]nd" -> Set{2,3} */
  trickySet(w, text) {
    const s = new Set();
    if (!w.mark) return s;
    let plain = "", inB = false;
    for (const c of w.mark) {
      if (c === "[") { inB = true; continue; }
      if (c === "]") { inB = false; continue; }
      if (inB) s.add(plain.length);
      plain += c;
    }
    return plain === (text || w.en) ? s : new Set();
  },
  /* Wort mit farbigen Buchstaben */
  letters(text, set, cls) {
    return [...text].map((c, i) => set && set.has(i) ? `<span class="${cls}">${U.esc(c)}</span>` : U.esc(c)).join("");
  },
  /* Schreibweisen eines Eintrags wie im Buch:
     "(to) know" -> know, to know · "before school/lessons" -> before school, before lessons
     "a hundred / one hundred" -> beide · "man, pl men" -> man · "..." und ?.! am Ende fallen weg */
  variants(en) {
    const s = String(en).replace(/,\s*pl\s.*$/, "").replace(/\(=[^)]*\)/g, " ").replace(/\.\.\.|…/g, " ");
    const bases = [s.replace(/\([^)]*\)/g, " "), s.replace(/[()]/g, " ")];
    const out = [];
    bases.forEach(b => b.split(/\s+\/\s+/).forEach(part => {
      let combos = [""];
      part.trim().split(/\s+/).filter(Boolean).forEach(tok => {
        const alts = tok.split("/").filter(x => x.length);
        const next = [];
        combos.forEach(c => alts.forEach(a => next.push((c + " " + a).trim())));
        combos = next;
      });
      combos.forEach(c => { c = c.replace(/[\s.?!]+$/, "").replace(/\s+/g, " ").trim(); if (c && !out.includes(c)) out.push(c); });
    }));
    return out.length ? out : [String(en)];
  },
  /* Schreibweise für die Rechtschreib-Aufgaben: bei Schrägstrichen wie im Buch ("he/she/it isn't"),
     sonst die erste Form ("(to) know" -> "know") */
  bookSpell(en, forms) {
    if (!/\//.test(en)) return forms[0];
    return String(en).replace(/,\s*pl\s.*$/, "").replace(/\(=[^)]*\)/g, " ").replace(/\([^)]*\)/g, " ").replace(/\.\.\.|…/g, " ")
      .replace(/\s+/g, " ").trim().replace(/[\s.?!]+$/, "");
  },
  wordRegex(en) { return new RegExp("(^|[^A-Za-z'])(" + en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![A-Za-z])", "i"); },
  inputAttrs: 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"'
};

/* ---------- Daten ---------- */
const Data = {
  sets: [], words: [], byId: {},
  load(sets) {
    this.sets = sets.map(s => {
      const words = s.words.map((w, i) => {
        const forms = U.variants(w.en);
        const pl = /,\s*pl\s+(.+)$/.exec(w.en);           // "man, pl men" -> "men" im Satz erkennen
        const find = forms.concat(pl ? [pl[1].trim()] : [], w.find || []);
        const sayForm = U.variants(String(w.en).replace(/\s*\([^)]*\)\s*$/, "").replace(/[()]/g, ""))[0];
        if (!w.say && !forms.includes(sayForm)) forms.push(sayForm);   // was vorgelesen wird, zählt auch beim Tippen
        return Object.assign({}, w, { id: s.id + ":" + w.en, setId: s.id, order: i, ex: w.ex || [],
          forms, find, say: w.say || sayForm,
          // ganz offene Einträge ("about me/you/...") nur als Bedeutung üben
          sp: /\/\s*(\.\.\.|…)/.test(w.en) ? null : U.bookSpell(w.en, forms) });
      });
      // die Buch-Schreibweise mit Schrägstrich ("he/she/it isn't") zählt beim Tippen auch
      words.forEach(w => { if (w.sp && !w.forms.includes(w.sp)) w.forms.push(w.sp); });
      return Object.assign({}, s, { words });
    });
    this.words = this.sets.flatMap(s => s.words);
    this.words.forEach(w => this.byId[w.id] = w);
    const groups = (typeof VOCAB_SYN !== "undefined" ? VOCAB_SYN : []);
    this.words.forEach(w => { w.syn = new Set(); });
    groups.forEach((g, gi) => this.words.filter(w => g.includes(w.en)).forEach(w => w.syn.add(gi)));
  },
  related(a, b) { for (const g of a.syn || []) if (b.syn && b.syn.has(g)) return true; return false; },
  /* Welche Schreibweise steckt im Satz? -> { form, match } oder null */
  findIn(w, sentence) {
    const forms = (w.find || w.forms || [w.en]).slice().sort((a, b) => b.length - a.length);
    for (const f of forms) { const m = U.wordRegex(f).exec(sentence); if (m) return { form: f, text: m[2] }; }
    return null;
  },
  set(id) { return this.sets.find(s => s.id === id); },
  sentencesWith(w) { return w.ex.filter(e => this.findIn(w, e.en)); }
};

/* ---------- Speicher (nur auf diesem Gerät) ---------- */
const Store = {
  key: "vokabeln", data: null,
  defaults() {
    return { v: 1, words: {}, xp: 0, streak: 0, lastLessonDay: null, lastPlayDay: null,
      packsDone: {}, settings: { sound: true, speech: true, voice: null }, app: {} };
  },
  load(key) {
    this.key = key;
    let d = null;
    try { d = JSON.parse(localStorage.getItem(key)); } catch (e) { d = null; }
    this.data = Object.assign(this.defaults(), d || {});
    this.data.settings = Object.assign(this.defaults().settings, this.data.settings || {});
    // höchster je gesehener Tag (wird die Handy-Uhr zurückgestellt, zählt nichts für die Stufen)
    if (!(this.data.maxDay >= U.today())) this.data.maxDay = Math.max(this.data.maxDay || 0, U.today());
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* kein Speicher verfügbar */ } },
  reset() { this.data = this.defaults(); this.save(); },
  w(id) {
    let s = this.data.words[id];
    if (!s) s = this.data.words[id] = { box: 0, due: 0, wrong: 0, mWrong: 0, sWrong: 0, hard: false, seen: 0 };
    return s;
  }
};

/* ---------- Lernstand & Planung ---------- */
const Plan = {
  isLearned(w) { const s = Store.data.words[w.id]; return !!(s && s.box >= 1); },
  /* ---------- Lernstufen ---------- */
  stageDays() {
    const d = Store.data.settings.stageDays;
    return Array.isArray(d) && d.length === 6 && d.every(x => x >= 1) ? d : CONFIG.STAGE_DAYS;
  },
  dailyMax() { const m = Store.data.settings.dailyMax; return m >= 1 ? m : CONFIG.DAILY_DUE_MAX; },
  spellMeaning() { const v = Store.data.settings.spellMeaning; return v == null ? CONFIG.SPELL_COUNTS_MEANING : !!v; },
  days(stage) { return this.stageDays()[Math.min(6, Math.max(1, stage)) - 1]; },
  /* Uhr zurückgestellt? Dann zählt nichts für die Stufen, bis der Tag wieder erreicht ist. */
  clockBack() { return U.today() < (Store.data.maxDay || 0); },
  /* alte Box (0–7) -> Stufe 1–6; beide Teile starten gleich, die Fälligkeit bleibt erhalten */
  migrate(w, s) {
    if (!s || s.t || !(s.box >= 1)) return;
    const st = Math.min(6, Math.max(1, s.box)), due = s.due || U.today();
    s.t = { m: { st, due }, s: w.sp ? { st, due } : null };
  },
  track(w, part) {
    const s = Store.data.words[w.id];
    if (!s || !(s.box >= 1)) return null;
    if (!s.t) this.migrate(w, s);
    return part === "s" ? s.t.s : s.t.m;
  },
  stage(w, part) { const t = this.track(w, part); return t ? t.st : 0; },
  /* Stufe des ganzen Worts: der schwächere Teil zählt (Wörter ohne Rechtschreibung: nur Bedeutung) */
  wordStage(w) { const m = this.stage(w, "m"); if (!m) return 0; return w.sp && this.track(w, "s") ? Math.min(m, this.stage(w, "s")) : m; },
  sits(w) { return this.wordStage(w) >= 6; },
  almost(w) { return this.wordStage(w) >= 4; },
  solidCount(setId) { return Data.words.filter(w => (!setId || w.setId === setId) && this.sits(w)).length; },
  almostCount(setId) { return Data.words.filter(w => (!setId || w.setId === setId) && this.almost(w)).length; },
  /* bald auffrischen: niedrige Stufe oder beim freiwilligen Üben zuletzt danebengelegen */
  refreshSoon(w) {
    if (!this.isLearned(w)) return false;
    const s = Store.data.words[w.id];
    return this.wordStage(w) <= 2 || (s.ref != null && U.today() - s.ref <= 14);
  },
  /* erledigte fällige Wiederholungen insgesamt; alte Spielstände starten mit einer Schätzung aus den Stufen */
  reviewsDone() {
    const d = Store.data;
    if (d.reviewsDone == null) {
      let n = 0;
      Data.words.forEach(w => { if (!this.isLearned(w)) return; ["m", "s"].forEach(p => { const t = this.track(w, p); if (t) n += t.st - 1; }); });
      d.reviewsDone = n;
    }
    return d.reviewsDone;
  },
  countedToday() { const c = Store.data.dueCount; return c && c.day === U.today() ? c.n : 0; },
  /* Heute fällige Abfragen (Wort + Teil). Reihenfolge: wer im Verhältnis zu seinem Abstand am längsten
     überfällig ist, kommt zuerst (so bleibt kein Wort ewig liegen); bei Gleichstand die niedrigere Stufe. */
  dueTracks() {
    const t = U.today(), out = [];
    if (this.clockBack()) return out;
    Data.words.forEach(w => {
      if (!this.isLearned(w)) return;
      ["m", "s"].forEach(part => { const tr = this.track(w, part); if (tr && tr.due <= t) out.push({ w, part, st: tr.st, due: tr.due, tr, late: (t - tr.due + 1) / this.days(tr.st) }); });
    });
    out.sort((a, b) => (b.late - a.late) || (a.st - b.st));
    return out;
  },
  /* Nach einer langen Pause (Ferien) wird nicht alles auf einmal fällig:
     höchstens dailyMax Abfragen heute, der Rest verteilt sich auf die nächsten Tage. Einmal pro Rückkehr. */
  spreadAfterBreak() {
    const d = Store.data, t = U.today();
    if (d.lastPlayDay == null || t - d.lastPlayDay < CONFIG.BREAK_DAYS || d.spreadDay === t) return 0;
    const max = this.dailyMax(), rest = this.dueTracks().slice(max);
    rest.forEach((x, i) => { x.tr.due = t + 1 + Math.floor(i / max); this.syncBox(x.w, Store.data.words[x.w.id]); });
    d.spreadDay = t; Store.save();
    return rest.length;
  },
  isDueNow(w, part) { return this.dueTracks().some(x => x.w === w && x.part === part); },
  dueParts(w) { return this.dueTracks().filter(x => x.w === w).map(x => x.part); },
  /* welcher Teil soll abgefragt werden? zuerst ein fälliger. Sind beide dran, meist Schreiben –
     richtig geschrieben zählt dann für beide Teile. */
  duePart(w) {
    const d = this.dueParts(w);
    if (d.length === 1) return d[0];
    // meistens Schreiben (zählt dann für beide), ab und zu Bedeutung – damit die Aufgaben abwechslungsreich bleiben
    if (d.length === 2) return this.spellMeaning() && this.spellLevel(w, false) < 3 ? (Math.random() < 0.7 ? "s" : "m") : Builder.reviewPart(w);
    return null;
  },
  isHard(w) { const s = Store.data.words[w.id]; return !!(w.problem || (s && s.hard)); },
  interval(box, hard) {
    const base = CONFIG.INTERVALS[Math.min(box, CONFIG.INTERVALS.length - 1)];
    return hard ? Math.max(1, Math.floor(base / 2)) : base;
  },
  setProgress(setId) {
    const set = Data.set(setId);
    const learned = set.words.filter(w => this.isLearned(w)).length;
    return { learned, total: set.words.length };
  },
  packs(setId) {
    const set = Data.set(setId);
    let chunks;
    if (set.words.every(w => w.pk)) {
      chunks = [];
      set.words.forEach(w => { const last = chunks[chunks.length - 1]; if (last && last.label === w.pk) last.push(w); else { const c = [w]; c.label = w.pk; chunks.push(c); } });
    } else chunks = U.chunk(set.words, CONFIG.PACK_SIZE);
    let prevDone = true;
    return chunks.map((words, index) => {
      const learned = words.filter(w => this.isLearned(w)).length;
      const done = learned === words.length;
      const started = words.some(w => Store.data.words[w.id] && Store.data.words[w.id].seen > 0);
      const unlocked = prevDone;
      prevDone = done;
      return { setId, index, words, learned, done, started, unlocked, label: words.label || ("Päckchen " + (index + 1)) };
    });
  },
  nextPack(setId) { return this.packs(setId).find(p => p.unlocked && !p.done) || null; },
  packsDoneToday() { return Store.data.packsDone[U.today()] || 0; },
  dueWords() {
    const seen = new Set(), out = [];
    this.dueTracks().forEach(x => { if (!seen.has(x.w.id)) { seen.add(x.w.id); out.push(x.w); } });
    return out;
  },
  learnedWords() { return Data.words.filter(w => this.isLearned(w)); },
  daysSinceLastLesson() {
    const l = Store.data.lastLessonDay;
    return l == null ? 0 : U.today() - l;
  },
  reviewCount() {
    return this.daysSinceLastLesson() >= CONFIG.BREAK_DAYS ? CONFIG.REVIEW_AFTER_BREAK : CONFIG.REVIEW_PER_LESSON;
  },
  streak() {
    const d = Store.data;
    if (d.lastLessonDay == null) return 0;
    return U.today() - d.lastLessonDay <= 1 ? d.streak : 0;
  },
  /* Ergebnis einer Wiederholung (nur die erste Antwort pro Wort und Teil zählt – das regelt Lesson).
     Fällig + richtig: eine Stufe höher. Fällig + falsch: eine Stufe tiefer, nie zurück auf Stufe 1; morgen wieder fällig.
     Nicht fällig (freiwilliges Üben): Stufe und Fälligkeit bleiben, ein Fehler setzt das Wort nur auf „bald auffrischen“.
     Rückgabe: { counted, from, to } für die Anzeige */
  reviewResult(w, ok, part, type) {
    const r = this.reviewOne(w, ok, part);
    // Fleiß-Zähler: jede erledigte fällige Wiederholung zählt, richtig oder falsch (freiwilliges Üben nicht)
    if (r.counted) { Store.data.reviewsDone = this.reviewsDone() + 1; Store.save(); }
    if (r.counted && ok && part === "s" && (type === "spell_tiles" || type === "spell_gap") && this.spellMeaning() && this.isDueNow(w, "m")) {
      const r2 = this.reviewOne(w, true, "m", true);
      r.alsoM = r2; r.sits = r.sits || r2.sits;
    }
    return r;
  },
  reviewOne(w, ok, part, silent) {
    const s = Store.w(w.id), t = U.today();
    if (!silent) s.seen++;
    if (!ok) { s.wrong++; if (part === "s") s.sWrong++; else s.mWrong++; }
    const tr = this.track(w, part);
    if (!tr || !this.isDueNow(w, part)) {
      if (!ok && tr) s.ref = t;
      Store.save();
      return { counted: false, from: tr ? tr.st : 0, to: tr ? tr.st : 0 };
    }
    const from = tr.st;
    if (ok) { tr.st = Math.min(6, tr.st + 1); tr.due = t + this.days(tr.st); if (tr.st >= 4) s.hard = false; }
    else { tr.st = tr.st > 1 ? Math.max(2, tr.st - 1) : 1; tr.due = t + 1; s.hard = true; }
    if (ok && s.ref != null) delete s.ref;
    const c = Store.data.dueCount;
    Store.data.dueCount = { day: t, n: (c && c.day === t ? c.n : 0) + 1 };
    this.syncBox(w, s);
    if (ok && tr.st === 6 && this.sits(w)) s.sat = s.sat || t;
    Store.save();
    return { counted: true, from, to: tr.st, sits: ok && this.sits(w) && from === 5 && tr.st === 6 };
  },
  /* alte Felder mitführen (box = schwächere Stufe, due = früheste Fälligkeit) */
  syncBox(w, s) {
    const parts = [s.t.m].concat(s.t.s ? [s.t.s] : []);
    s.box = Math.max(1, Math.min(...parts.map(x => x.st)));
    s.due = Math.min(...parts.map(x => x.due));
  },
  /* Neues Wort: Bedeutung und Schreibweise geschafft -> beide Teile starten in Stufe 1 */
  newLearned(w, mistakes) {
    const s = Store.w(w.id), t = U.today(), due = t + this.days(1);
    s.box = 1;
    if (mistakes >= 2) s.hard = true;
    s.t = { m: { st: 1, due }, s: w.sp ? { st: 1, due } : null };
    s.due = due;
    Store.save();
  },
  markSeen(w) { const s = Store.w(w.id); s.seen++; Store.save(); },
  /* Stufe der Rechtschreibaufgabe: 1 Kacheln, 2 Lückenwort, 3 Hören+Tippen */
  spellLevel(w, isNew) {
    if (isNew) return 1;
    const st = this.stage(w, "s");
    let lvl = st >= 5 ? 3 : st >= 3 ? 2 : 1;
    if (this.isHard(w)) lvl = Math.max(1, lvl - 1);
    return lvl;
  },
  lessonFinished() {
    const d = Store.data, t = U.today();
    if (d.lastLessonDay === t) { /* schon heute */ }
    else if (d.lastLessonDay === t - 1) d.streak = (d.streak || 0) + 1;
    else d.streak = 1;
    d.lastLessonDay = t;
    Store.save();
  },
  addXP(n) { Store.data.xp += n; Store.save(); if (Engine.onXP) Engine.onXP(n); }
};

/* ---------- Lektionen zusammenstellen ---------- */
const Builder = {
  pickReview(n, exclude, setId) {
    const ex = new Set((exclude || []).map(w => w.id));
    return Plan.dueWords().filter(w => !ex.has(w.id) && (!setId || w.setId === setId)).slice(0, n);
  },
  newLesson(setId, packIndex) {
    const pack = Plan.packs(setId)[packIndex];
    const newWords = pack.words.filter(w => !Plan.isLearned(w));
    const rv = this.pickReview(Plan.reviewCount(), pack.words);
    // leichte Wörter zuerst (hohe Stufe)
    const sorted = rv.slice().sort((a, b) => Plan.wordStage(b) - Plan.wordStage(a));
    const warmN = rv.length >= 6 ? 3 : Math.min(2, rv.length);
    const warm = sorted.slice(0, warmN);
    const rest = U.shuffle(sorted.slice(warmN));
    const endN = Math.min(3, Math.floor(rest.length / 2));
    const end = rest.splice(rest.length - endN, endN);
    const mid = rest;
    const items = [];
    warm.forEach(w => { const part = Plan.duePart(w) || "m"; items.push({ kind: "task", w, part, review: true, easy: part === "m" }); });
    const pairs = U.chunk(U.shuffle([]).concat(newWords), 2);
    pairs.forEach((pair, i) => {
      pair.forEach(w => items.push({ kind: "intro", w }));
      pair.forEach(w => items.push({ kind: "task", w, part: "m", isNew: true }));
      if (i > 0) pairs[i - 1].forEach(w => items.push({ kind: "task", w, part: "s", isNew: true }));
      if (mid.length) { const w = mid.shift(); items.push({ kind: "task", w, part: Plan.duePart(w) || this.reviewPart(w), review: true }); }
    });
    if (pairs.length) pairs[pairs.length - 1].forEach(w => items.push({ kind: "task", w, part: "s", isNew: true }));
    if (newWords.length >= 4) items.push({ kind: "match", words: U.shuffle(newWords).slice(0, 4) });
    mid.forEach(w => items.push({ kind: "task", w, part: Plan.duePart(w) || this.reviewPart(w), review: true }));
    end.forEach(w => { const part = Plan.duePart(w) || this.reviewPart(w); items.push({ kind: "task", w, part, review: true, easy: part === "m" }); });
    return { kind: "new", setId, packIndex, items, newWords, reviewWords: rv };
  },
  reviewPart(w) {
    if (!w.sp) return "m";
    const s = Store.data.words[w.id] || {};
    if ((s.sWrong || 0) > (s.mWrong || 0)) return "s";
    if ((s.mWrong || 0) > (s.sWrong || 0)) return "m";
    return Math.random() < 0.5 ? "s" : "m";
  },
  /* Reiner Wiederholungsmodus (alle Sets) */
  reviewLesson(n, fillWeak, setId) {
    let words = this.pickReview(n || CONFIG.REVIEW_LESSON_SIZE, null, setId);
    if (fillWeak && words.length < n) {
      const have = new Set(words.map(w => w.id));
      const weak = Plan.learnedWords().filter(w => !have.has(w.id) && (!setId || w.setId === setId))
        .sort((a, b) => (Plan.refreshSoon(b) - Plan.refreshSoon(a)) || (Plan.wordStage(a) - Plan.wordStage(b)));
      words = words.concat(U.shuffle(weak.slice(0, Math.max(n * 2, 8))).slice(0, n - words.length));
    }
    if (!words.length) return null;
    return { kind: "review", items: this.reviewItems(words), newWords: [], reviewWords: words };
  },
  /* Ein fertiges Päckchen noch einmal üben */
  packReview(setId, packIndex) {
    const pack = Plan.packs(setId)[packIndex];
    const words = pack ? pack.words.filter(w => Plan.isLearned(w)) : [];
    if (!words.length) return null;
    return { kind: "review", practice: true, setId, packIndex, items: this.reviewItems(words), newWords: [], reviewWords: words };
  },
  /* Fit für die Klassenarbeit: alle gelernten Wörter einer Unit (oder bestimmter Buchseiten) gemischt.
     Zuerst fällige, dann die heute in diesem Modus noch nicht geübten, schwächere Stufen zuerst. */
  examLesson(setId, from, to, n) {
    const t = U.today(), ex = Store.data.examSeen && Store.data.examSeen.day === t ? Store.data.examSeen : (Store.data.examSeen = { day: t, ids: [] });
    const pool = Plan.learnedWords().filter(w => w.setId === setId && (from == null || (w.pg >= from && w.pg <= to)));
    if (!pool.length) return null;
    const due = new Set(Plan.dueWords().map(w => w.id)), done = new Set(ex.ids);
    const pr = w => (due.has(w.id) ? 0 : 2) + (done.has(w.id) ? 4 : 0) + Plan.wordStage(w) / 10 + Math.random() / 20;
    const words = pool.slice().sort((a, b) => pr(a) - pr(b)).slice(0, n || 15);
    words.forEach(w => { if (!done.has(w.id)) ex.ids.push(w.id); });
    Store.save();
    return { kind: "review", practice: true, exam: true, setId, items: this.reviewItems(words, true), newWords: [], reviewWords: words };
  },
  reviewItems(words, mix) {
    words = U.shuffle(words);
    const items = [];
    words.forEach((w, i) => {
      // fällige Teile zuerst; sonst wie bisher (die ersten zwei als leichte Bedeutungsaufgabe)
      const dp = Plan.duePart(w);
      const part = dp || (mix ? (w.sp && Math.random() < 0.5 ? "s" : "m") : i < 2 ? "m" : this.reviewPart(w));
      items.push({ kind: "task", w, part, review: true, easy: !mix && i < 2 && part === "m" });
      if (i === Math.floor(words.length / 2) && words.length >= 6) {
        items.push({ kind: "match", words: U.shuffle(words).slice(0, 4), review: true });
      }
    });
    return items;
  }
};

/* ---------- Ton (kleiner Jingle ohne Dateien) ---------- */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(freq, start, dur, type, vol) {
    const c = this.ctx; const o = c.createOscillator(); const g = c.createGain();
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination); o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
  },
  play(name) {
    if (!Store.data.settings.sound) return;
    if (!this.ensure()) return;
    try {
      if (name === "correct") { this.tone(659, 0, .14); this.tone(988, .09, .22); }
      else if (name === "wrong") { this.tone(392, 0, .16, "sine", .12); this.tone(330, .12, .22, "sine", .1); }
      else if (name === "combo") { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .08, .2)); }
      else if (name === "finish") { [523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .26, "triangle", .2)); }
      else if (name === "tap") { this.tone(880, 0, .05, "sine", .06); }
      else if (name === "trumpet") { this.tone(233, 0, .22, "sawtooth", .09); this.tone(311, .18, .22, "sawtooth", .09); this.tone(466, .38, .55, "sawtooth", .11); }
      else if (name === "sweep") { [880, 660, 990, 740, 1100, 820].forEach((f, i) => this.tone(f, i * .12, .1, "sine", .05)); }
      else if (name === "roar") { this.tone(98, 0, .5, "sawtooth", .12); this.tone(82, .12, .6, "sawtooth", .1); this.tone(110, .02, .35, "square", .04); }
      else if (name === "coin") { this.tone(988, 0, .08, "square", .07); this.tone(1319, .07, .18, "square", .07); }
    } catch (e) {}
  }
};

/* ---------- Vorlesen (Sprachausgabe des Handys) ---------- */
const Speech = {
  voice: null, listeners: [],
  get ok() { return "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined"; },
  /* Spaß-Stimmen von Apple/macOS, die für Vokabeln ungeeignet sind */
  NOVELTY: /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Junior|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i,
  LANGS: { "en-GB": "Britisch", "en-US": "Amerikanisch", "en-AU": "Australisch", "en-IE": "Irisch", "en-IN": "Indisch", "en-ZA": "Südafrikanisch", "en-CA": "Kanadisch", "en-NZ": "Neuseeländisch", "en-SC": "Schottisch" },
  english() {
    if (!this.ok) return [];
    return speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang) && !this.NOVELTY.test(v.name));
  },
  /* Qualität schätzen: bessere Stimmen und britisches Englisch zuerst */
  score(v) {
    let s = 0;
    const lang = v.lang.replace("_", "-");
    if (/^en-GB/i.test(lang)) s += 30; else if (/^en-US/i.test(lang)) s += 18; else s += 8;
    if (/premium|enhanced|natural|neural|wavenet|erweitert|siri/i.test(v.name)) s += 40;
    if (/^(Daniel|Serena|Kate|Arthur|Martha|Oliver|Stephanie|Jamie)\b/i.test(v.name)) s += 12;
    if (/Google UK English/i.test(v.name)) s += 20;
    if (v.localService) s += 10; // funktioniert auch ohne Internet
    if (v.default) s += 2;
    return s;
  },
  sorted() { return this.english().sort((a, b) => this.score(b) - this.score(a)); },
  /* fest: britisches Englisch, die Standardstimme des Geräts (iPhone: Daniel) – keine Auswahl, keine Spaß-Stimmen */
  choose() {
    const gb = this.english().filter(v => /^en[-_]GB/i.test(v.lang));
    this.voice = gb.find(v => v.default) || gb.find(v => /^Daniel\b/i.test(v.name) && !/premium|enhanced|erweitert/i.test(v.name))
      || gb.find(v => /Google UK English/i.test(v.name)) || gb.find(v => v.localService) || gb[0] || null;
  },
  init() {
    if (!this.ok) return;
    const upd = () => { this.choose(); this.listeners.forEach(f => f()); };
    upd();
    try { speechSynthesis.addEventListener("voiceschanged", upd); } catch (e) { speechSynthesis.onvoiceschanged = upd; }
  },
  say(text, slow) {
    if (!this.ok || !Store.data.settings.speech) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/\s*\/\s*/g, ", "));
      u.lang = "en-GB";
      if (this.voice) u.voice = this.voice;
      u.rate = slow ? 0.6 : 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  },
  /* mehrere Texte direkt nacheinander vorlesen (erst das Wort, dann der Beispielsatz) */
  sayAll(list) {
    if (!this.ok || !Store.data.settings.speech) return;
    try {
      speechSynthesis.cancel();
      list.filter(Boolean).forEach(text => {
        const u = new SpeechSynthesisUtterance(String(text).replace(/\s*\/\s*/g, ", "));
        u.lang = "en-GB"; if (this.voice) u.voice = this.voice; u.rate = 0.9;
        speechSynthesis.speak(u);
      });
    } catch (e) {}
  },
  btn(text, cls) { return this.ok && Store.data.settings.speech ? `<button class="say ${cls || ""}" data-say="${U.esc(text)}" aria-label="Vorlesen">🔊</button>` : ""; },

  /* ---------- Stimmenauswahl für die Einstellungen ---------- */
  SAMPLE: "Hello! I'm Mio. Let's learn English together!",
  label(v) {
    const lang = v.lang.replace("_", "-");
    const name = v.name.replace(/^(Microsoft|Google|Apple)\s+/i, "").replace(/\s*\((Natural|Online)[^)]*\)/gi, "").replace(/\s+-\s+English.*$/i, "");
    return { name, lang: this.LANGS[lang] || "Englisch", good: /premium|enhanced|natural|neural|erweitert/i.test(v.name), online: !v.localService };
  },
  section() {
    return `<section class="card voices"><p class="bk-title">🗣️ Stimme zum Vorlesen</p>
      <p class="small">Vorgelesen wird immer in britischem Englisch mit der Standardstimme des Geräts${this.voice ? ` (${U.esc(this.label(this.voice).name)})` : ""}.</p>
      <button class="btn" data-testsay>▶ Stimme anhören</button></section>`;
  },
  bindSettings(root) {
    const box = root.querySelector("[data-voice-list]");
    if (!box) return;
    const draw = () => {
      if (!box.isConnected) return;
      if (!this.ok) { box.innerHTML = `<p class="small">Dieses Gerät kann leider nicht vorlesen.</p>`; return; }
      const list = this.sorted();
      if (!list.length) { box.innerHTML = `<p class="small">Stimmen werden geladen … Falls hier nichts erscheint, hat dieses Gerät keine englische Stimme.</p>`; return; }
      const chosen = Store.data.settings.voice || "";
      const auto = list[0];
      const row = (id, title, sub, on) => `<button class="voice-row ${on ? "on" : ""}" data-voice="${U.esc(id)}">
        <span class="vr-check">${on ? "✓" : ""}</span><span class="vr-txt"><b>${U.esc(title)}</b><span>${U.esc(sub)}</span></span><span class="vr-play">▶</span></button>`;
      box.innerHTML = row("", "Automatisch", `beste Stimme: ${this.label(auto).name}`, !chosen || !list.some(v => v.voiceURI === chosen)) +
        list.map(v => { const l = this.label(v);
          return row(v.voiceURI, l.name, l.lang + (l.good ? " · beste Qualität" : "") + (l.online ? " · braucht Internet" : ""), v.voiceURI === chosen); }).join("");
      box.querySelectorAll("[data-voice]").forEach(b => b.onclick = () => {
        Store.data.settings.voice = b.dataset.voice || null; Store.save();
        this.choose(); draw();
        const was = Store.data.settings.speech; Store.data.settings.speech = true; this.say(this.SAMPLE); Store.data.settings.speech = was;
      });
    };
    draw();
    this.listeners = this.listeners.filter(f => f.box && f.box.isConnected);
    const f = () => draw(); f.box = box; this.listeners.push(f);
  }
};

/* ---------- Jubel-Effekte: Konfetti, Herzen, Sterne, Feuerwerk, Luftballons ---------- */
const Confetti = {
  canvas: null, parts: [], running: false, last: null,
  TYPES: ["confetti", "hearts", "stars", "fireworks", "balloons"],
  COLS: ["#FF8A3D", "#FFD23F", "#3BC9A0", "#4D96FF", "#FF6B9A", "#A78BFA"],
  /* abwechselnd: nie zweimal hintereinander derselbe Effekt */
  pick() { const t = U.pick(this.TYPES.filter(x => x !== this.last)); this.last = t; return t; },
  burst(n, type) {
    if (!this.canvas) {
      this.canvas = document.createElement("canvas"); this.canvas.className = "confetti";
      document.body.appendChild(this.canvas);
    }
    const c = this.canvas, d = devicePixelRatio || 1;
    if (!this.running) { c.width = innerWidth * d; c.height = innerHeight * d; }
    const W = c.width, H = c.height;
    type = type || "confetti"; n = n || 80;
    const add = p => this.parts.push(Object.assign({ life: 0, delay: 0, r: 0, vr: 0, alpha: 1, col: U.pick(this.COLS), kind: type }, p));
    if (type === "fireworks") {
      const shots = Math.max(2, Math.min(4, Math.round(n / 40)));
      for (let k = 0; k < shots; k++) {
        const cx = W * (0.2 + Math.random() * 0.6), cy = H * (0.15 + Math.random() * 0.3), col = U.pick(this.COLS), m = Math.round(n / shots) + 20;
        for (let i = 0; i < m; i++) {
          const a = (Math.PI * 2 * i) / m, v = (3.5 + Math.random() * 5.5) * d;
          add({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: 4.5 * d, col: Math.random() < 0.7 ? col : "#FFFFFF", delay: k * 14, max: 70 });
        }
      }
    } else if (type === "balloons") {
      for (let i = 0; i < Math.max(6, Math.round(n / 7)); i++)
        add({ x: W * (0.08 + Math.random() * 0.84), y: H + Math.random() * H * 0.25, vx: 0, vy: (-9 - Math.random() * 6) * d, s: (16 + Math.random() * 10) * d, sway: Math.random() * 6, max: 150 });
    } else {
      for (let i = 0; i < n; i++)
        add({ x: W * (0.2 + Math.random() * 0.6), y: H * 0.35, vx: (Math.random() - .5) * 16 * d, vy: (-Math.random() * 14 - 6) * d,
          s: (type === "confetti" ? 6 + Math.random() * 6 : 10 + Math.random() * 8) * d, r: Math.random() * 6, vr: (Math.random() - .5) * .3, max: 240 });
    }
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.step()); }
  },
  heart(g, s) { g.beginPath(); g.moveTo(0, s * .3); g.bezierCurveTo(-s * .9, -s * .35, -s * .35, -s * .9, 0, -s * .35);
    g.bezierCurveTo(s * .35, -s * .9, s * .9, -s * .35, 0, s * .3); g.fill(); },
  star(g, s) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * .4 : s * .9; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fill(); },
  step() {
    const c = this.canvas, g = c.getContext("2d"), d = devicePixelRatio || 1;
    g.clearRect(0, 0, c.width, c.height);
    this.parts.forEach(p => {
      if (p.delay > 0) { p.delay--; return; }
      p.life++;
      if (p.kind === "fireworks") { p.vx *= .96; p.vy = p.vy * .96 + .12 * d; p.alpha = Math.max(0, 1 - p.life / p.max); }
      else if (p.kind === "balloons") { p.vy *= .995; p.x += Math.sin((p.life + p.sway * 10) / 12) * 1.2 * d; }
      else { p.vy += .45 * d; p.vx *= .99; p.r += p.vr; }
      p.x += p.vx; p.y += p.vy;
      g.save(); g.globalAlpha = p.alpha; g.translate(p.x, p.y); g.fillStyle = p.col;
      if (p.kind === "hearts") { g.rotate(p.r * .3); this.heart(g, p.s); }
      else if (p.kind === "stars") { g.rotate(p.r); this.star(g, p.s); }
      else if (p.kind === "fireworks") { g.beginPath(); g.arc(0, 0, p.s, 0, Math.PI * 2); g.fill(); }
      else if (p.kind === "balloons") {
        g.beginPath(); g.ellipse(0, 0, p.s * .8, p.s, 0, 0, Math.PI * 2); g.fill();
        g.globalAlpha = p.alpha * .35; g.fillStyle = "#fff"; g.beginPath(); g.ellipse(-p.s * .3, -p.s * .35, p.s * .18, p.s * .28, 0, 0, Math.PI * 2); g.fill();
        g.globalAlpha = p.alpha; g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 1.5 * d; g.beginPath(); g.moveTo(0, p.s); g.lineTo(Math.sin(p.life / 6) * 4 * d, p.s * 2.4); g.stroke();
      }
      else { g.rotate(p.r); g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      g.restore();
    });
    this.parts = this.parts.filter(p => p.delay > 0 || (p.life < p.max && p.y < c.height + 60 && p.y > -c.height * 0.5 && p.alpha > 0));
    if (this.parts.length) requestAnimationFrame(() => this.step());
    else { this.running = false; g.clearRect(0, 0, c.width, c.height); }
  }
};
