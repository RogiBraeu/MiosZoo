    if (this.view === "zoo") app.innerHTML = this.zooView();
    else if (this.view === "shop") app.innerHTML = this.shopView();
    else if (this.view === "trophies") app.innerHTML = this.trophiesView();
    else app.innerHTML = this.settingsView();
    app.insertAdjacentHTML("beforeend", this.nav() + `<div class="dialog" hidden></div>`);
    this.paint(app);
    this.bind(app);
    window.scrollTo(0, keep ? y : 0);
    if (this.quiet) return;
    if (this.view !== "settings" && this.holidayMsg) {
      this.holidayMsg = false;
      this.dialog(`<div class="party-mio">${Mio.svg("cheer")}</div><p class="dlg-title">Welcome back!</p>
        <p>Mio hat auf die Tiere aufgepasst, während du weg warst. Jetzt haben sie ein bisschen Hunger.</p>
        <button class="btn primary big" data-close>Los geht's!</button>`, d => { d.dataset.rerender = "1"; });
    } else if (this.view !== "settings" && this.A.welcome.length) this.welcomeAnimal();
    else if (this.view !== "settings" && (this.A.friendWelcome || []).length) this.friendPopup();
    else if (this.pendingZoo) this.zooParty();
    else if (this.view !== "settings" && this.A.jokerNew > 0) this.jokerPopup();
    else if (this.view !== "settings" && this.A.babyQueue.length) this.babyPopup();
    else if (this.view !== "settings" && (this.A.babyWaitNew || []).length) this.babyWaitPopup();
    else if (this.view !== "settings" && this.A.trophyQueue.length) this.trophyPopup();
    else if (this.view !== "settings" && this.A.gateQueue.length) this.gatePopup();
    else if (this.returnEnc) { const id = this.returnEnc; this.returnEnc = null; if (this.view === "zoo" && this.A.unlocked.includes(id)) this.openEnc(id); }
  },

  zooView() {
    const h = this.hint();
    return `${this.header()}
      ${TEST_MODE ? `<div class="test-banner">🧪 Testversion mit Testwörtern</div>` : ""}
      <div class="hero"><div class="hero-mio">${Mio.svg(h.mood)}</div>
        <div class="bubble"><b>${U.esc(h.en)}</b><br>${U.esc(h.de)}</div></div>
      ${this.invBar()}
      ${this.statusCard()}
      <div class="zoo-grid"><button class="enc gate-card" data-gate><div class="scene gate-scene" data-gatescene></div>
          <div class="enc-name"><span>${U.esc(this.zooTitle())}</span><span class="enc-ico">🏛️ ${this.gateCount()}/${this.gateTotal()}</span></div></button>
        ${ANIMALS.map(a => this.A.unlocked.includes(a.id) ? this.encCard(a) : this.lockedCard(a)).join("")}</div>`;
  },
  statusCard() {
    const ids = this.A.unlocked, n1 = ids.filter(id => this.heart1(id)).length, n2 = ids.filter(id => this.heart2(id)).length;
    return `<div class="zoo-status">
      <div class="zs-row"><span class="zs-name">❤️ Happy Zoo</span><b>${n1}/${ids.length}</b><span class="zs-streak" title="Serie">🔥 ${this.zooStreak(1)}</span></div>
      <div class="zs-row"><span class="zs-name">💖 Power-Zoo</span><b>${n2}/${ids.length}</b><span class="zs-streak" title="Power-Serie">⚡ ${this.zooStreak(2)}</span></div>
      <div class="zs-row"><span class="zs-name">🦊 Mio-Joker</span><b>${this.A.jokers}</b><span class="zs-next">nächster in ${this.nextJoker()} XP</span></div>
      <div class="zs-help">❤️ = gefüttert und sauber · 💖 = dazu Spielzeug erspielt · 🦊 = Mio putzt ein Gehege</div></div>`;
  },
  encCard(a) {
    const hu = this.hunger(a.id), di = this.dirt(a.id), ev = this.A.event && this.A.event.animal === a.id;
    const icons = this.sad(a.id) ? "😢" : (this.heart1(a.id) ? "❤️" : "🤍") + (this.heart2(a.id) ? "💖" : "🤍");
    return `<button class="enc ${ev ? "alert" : ""}" data-enc="${a.id}"><div class="scene" data-scene="${a.id}"></div>
      <div class="enc-name"><span>${a.name}</span><span class="enc-ico">${icons}</span></div></button>`;
  },
  lockedCard(a) {

      const n = Math.min(Plan.solidCount(), a.needN);
      return `<button class="enc locked special" data-special><div class="scene locked-scene"><span>❔</span></div>
        <div class="enc-name"><span>Bald neu</span><span class="enc-ico">🏅 ${n}/${a.needN}</span></div></button>`;
    }
    return `<div class="enc locked"><div class="scene locked-scene"><span>🔒</span></div>
      <div class="enc-name"><span>Bald neu</span></div></div>`;
  },

  /* Szene in einen Container zeichnen */
  scene(el, a, big, opts) {
    opts = opts || {};
    el.innerHTML = "";
    const cane = a.id === "owl" && this.hasDeco("cane", "owl") && this.seasonDecos().some(d => d.id === "cane");
    const bg = document.createElement("canvas"); bg.className = "bg"; Scene.draw(bg, a, { perch2: a.id === "owl" && this.hasFriend("owl"), look: this.look(), cane }); el.appendChild(bg);
    const evNow = this.A.event && this.A.event.animal === a.id ? EVENTS[this.A.event.type] : null;
    if (evNow && evNow.overlay) { const ov = document.createElement("canvas"); ov.className = "bg"; Scene.eventOverlay(ov, evNow.overlay, a); el.appendChild(ov); }
    const F = FRIENDS[a.id], friend = this.hasFriend(a.id);
    const mainPos = evNow && evNow.animalPos ? evNow.animalPos : a.pos;
    const dirt = document.createElement("canvas"); dirt.className = "bg dirt"; Scene.dirt(dirt, a, this.dirt(a.id)); el.appendChild(dirt);
    const hu = this.hunger(a.id);
    const mood = hu >= 2 ? "hungry" : hu === 1 ? "peckish" : "happy";
    const toy = TOYS[a.id];
    // Spielzeug, das heute im Gehege liegt (Ball, Wollknäuel, Eisrutsche)
    // die Eisrutsche steht fest im Gehege; Ball und Wollknäuel liegen in der Routine mit drin
    if (toy.fixed && (this.played(a.id) || opts.play)) {
      if (this.xmasBrush(a.id)) el.appendChild(Pix.el("brushx", "toy", toy.rest[0] - 3, toy.rest[1], 64, 44));
      else el.appendChild(Pix.el(toy.sprite, "toy", toy.rest[0], toy.rest[1], 64, 44));
    }
    this.paintDeco(el, a);
    if (this.sad(a.id) && !opts.play) {
      // traurig: sitzt da und weint
      const spots = [mainPos].concat(friend ? [F.pos] : []);
      spots.forEach((p, i) => {
        const fs = i === 1 ? (F.sprite || a.id) : a.id;
        el.appendChild(Pix.el(fs, "animal sad", p[0], p[1], 64, 44, i === 1));
        const ex = i === 1 ? Pix.size(fs).w - 1 - a.eye[0] : a.eye[0];
        [0, 1].forEach(k => el.appendChild(Pix.el("tear", "tear t" + k, p[0] + ex - 1, p[1] + a.eye[1] + 1, 64, 44)));
      });
      this.paintBaby(el, a, null, null, mainPos);
      const b = document.createElement("div"); b.className = "need";
      b.style.left = (100 * (a.pos[0] + 8) / 64) + "%"; b.style.top = (100 * Math.max(0, a.pos[1] - 9) / 44) + "%";
      b.appendChild(Pix.icon("sadheart")); el.appendChild(b);
    } else if (opts.play) {
      // einmaliges Spiel mit dem Spielzeug
      const pl = this.xmasToy(a.id) ? this.swapXmasToy(PLAYS[a.id]) : PLAYS[a.id], pk = "play_" + a.id + (pl !== PLAYS[a.id] ? "_x" : "");
      Routine.mount(el, pk, pl, { once: true, onEnd: opts.onEnd, sound: true });
      this.paintBaby(el, a, pl, pk, mainPos, true);
      if (friend) Routine.mount(el, a.id + "_friend", this.friendRoutine(a.id), F.delay ? { delay: F.delay } : {});
    } else if (hu === 0 && ROUTINES[a.id] && !evNow) {
      // satt: das Tier spielt (rutschen, tauchen, fliegen …) – mit Spielzeug auch immer wieder damit
      const withToy = this.played(a.id);
      const key = withToy ? a.id + "_toy" + (this.xmasToy(a.id) ? "_x" : "") : a.id, segs = withToy ? this.toyRoutine(a.id) : ROUTINES[a.id];
      Routine.mount(el, key, segs, { sound: true });
      this.paintBaby(el, a, segs, key, mainPos);
      // das zweite Tier macht seine eigene Runde (das Spielzeug gehört beiden)
      if (friend) Routine.mount(el, a.id + "_friend", this.friendRoutine(a.id), F.delay ? { delay: F.delay } : {});
    } else {
      // bei zwei Tieren: das schon gefütterte Tier ist froh, das andere wartet noch
      const half = friend && hu > 0 && this.fedToday(a.id) === 1;
      el.appendChild(Pix.el(a.id, "animal " + (half ? "happy" : mood), mainPos[0], mainPos[1], 64, 44));
      if (friend) el.appendChild(Pix.el(F.sprite || a.id, "animal twin " + mood, F.pos[0], F.pos[1], 64, 44, true));
      this.paintBaby(el, a, null, null, mainPos);
    }
    if (hu > 0 && !this.sad(a.id)) {
      const half = friend && this.fedToday(a.id) === 1, np = half ? F.pos : a.pos;
      const b = document.createElement("div"); b.className = "need";
      b.style.left = (100 * (np[0] + 8) / 64) + "%"; b.style.top = (100 * Math.max(0, np[1] - 9) / 44) + "%";
      b.appendChild(Pix.icon(a.food)); el.appendChild(b);
    }
    const ev = this.A.event;
    if (ev && ev.animal === a.id && EVENTS[ev.type].sprite) {
      const E = EVENTS[ev.type];
      el.appendChild(Pix.el(E.sprite, "event", E.pos[0], E.pos[1], 64, 44));
    }
    this.paintWeather(el, big);
    if (big) { const hz = document.createElement("div"); hz.className = "hearts"; el.appendChild(hz); }
  },
  /* Tagesroutine + Spiel mit dem Spielzeug (solange es heute da ist) */
  toyRoutine(id) {
    const toy = TOYS[id], base = ROUTINES[id];
    const play = PLAYS[id].map(x => Object.assign({}, x));
    const lying = toy.rest && !toy.fixed ? { f: toy.sprite, id: "toyrest", a: toy.rest } : null;
    if (lying) {
      // beim Nochmal-Spielen startet das Spielzeug dort, wo es liegt
      const f0 = play[0], fx = [].concat(f0.fx || []).map(x => x.f === toy.sprite ? Object.assign({}, x, { a: toy.rest }) : x);
      play[0] = Object.assign({}, f0, { fx });
    }
    const segs = base.map(x => lying ? Object.assign({}, x, { fx: [].concat(x.fx || [], [lying]) }) : x);
    // Laufweg vom Ende der Routine zum Start des Spiels
    const last = segs[segs.length - 1], end = last.b || last.a, start = play[0].a;
    if (play[0].f === id && (end[0] !== start[0] || end[1] !== start[1])) {
      const right = start[0] > end[0], facesRight = id === "seal";
      segs.push(Object.assign({ f: id, a: end, b: start, t: 1.2, flip: right ? !facesRight : facesRight }, lying ? { fx: [lying] } : {}));
    }
    const all = segs.concat(play);
    return this.xmasToy(id) ? this.swapXmasToy(all) : all;
  },
  swapXmasToy(segs) {
    const sw = x => x.f === "yarn" ? Object.assign({}, x, { f: "yarnx" }) : x;
    return segs.map(sg => sg.fx ? Object.assign({}, sg, { fx: [].concat(sg.fx).map(sw) }) : sg);
  },

  paint(root) {
    root.querySelectorAll("[data-decoico]").forEach(el => el.appendChild(this.decoIcon(DECOS.find(d => d.id === el.dataset.decoico), "penguin")));
    root.querySelectorAll("[data-troico]").forEach(el => { const tr = TROPHIES.find(x => x.id === el.dataset.troico); el.appendChild(this.trophyEl(tr, !this.A.trophies[tr.id])); });
    root.querySelectorAll("[data-scene]").forEach(el => this.scene(el, this.animal(el.dataset.scene)));
    root.querySelectorAll("[data-gatescene]").forEach(el => this.gateScene(el));
    root.querySelectorAll("[data-babyico]").forEach(el => { if (el.dataset.babyico) el.appendChild(Pix.icon(el.dataset.babyico + "_baby")); });
    root.querySelectorAll("[data-icon]").forEach(el => { el.innerHTML = ""; el.appendChild(Pix.icon(el.dataset.icon)); });
    const stall = root.querySelector("canvas.stall"); if (stall) this.drawStall(stall);
  },

  drawStall(c) {
    c.width = 64; c.height = 30; const g = c.getContext("2d");
    const f = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    f(0, 0, 64, 30, "#b07a42");
    for (let y = 9; y < 30; y += 4) { f(0, y, 64, 1, "#8b5a2b"); }
    for (let x = 0; x < 64; x += 8) { f(x, 0, 4, 8, "#d94848"); f(x + 4, 0, 4, 8, "#f7ead0"); }
    for (let x = 0; x < 64; x += 4) { f(x + 1, 8, 2, 1, (x / 4) % 2 ? "#f7ead0" : "#d94848"); }
    f(0, 8, 64, 0.5, "#9e2f2f");
    f(0, 21, 64, 9, "#7a4b2a"); f(0, 21, 64, 1, "#c08a4e"); f(0, 29, 64, 1, "#5e3a1a");
    [["fish", 6, 14], ["meat", 26, 12], ["feed", 46, 9]].forEach(([n, x, y]) => {
      f(x - 2, 19, 16, 3, "#8b5a2b"); f(x - 2, 19, 16, 1, "#c08a4e"); g.drawImage(Pix.canvas(n), x, y + (n === "fish" ? 3 : 0));
    });
  },

  /* Wiederholungs-Runden im Shop (pro Unit und Tag) */
  reviewRecent(setId) { const i = Data.sets.findIndex(x => x.id === setId); return i >= Data.sets.length - 2; },
  /* Zähler: heute neu gelerntes Päckchen eigener Zähler, sonst einer für die ganze Unit */
  reviewKey(setId, packIndex) {
    const pl = this.A.packLearned || {};
    return packIndex != null && pl[setId + ":" + packIndex] === U.today() ? "p:" + setId + ":" + packIndex : "u:" + setId;
  },
  reviewRounds(setId, packIndex) {
    const A = this.A, t = U.today();
    if (!A.revRounds || A.revRounds.day !== t || !A.revRounds.k) A.revRounds = { day: t, k: {} };
    return A.revRounds.k[this.reviewKey(setId, packIndex)] || 0;
  },
  reviewXP(setId, packIndex) {
    const list = REVIEW_XP[this.reviewRecent(setId) ? "recent" : "old"];
    return list[Math.min(this.reviewRounds(setId, packIndex), list.length - 1)];
  },
  shopPractice(packIndex) {
    const setId = this.A.setId, xp = this.reviewXP(setId, packIndex);
    this.A.revRounds.k[this.reviewKey(setId, packIndex)] = this.reviewRounds(setId, packIndex) + 1; Store.save();
    const { label, en, ...vals } = xp;
    this.practice(8, "Great work!", () => {}, vals, null, setId, packIndex);
  },

  packList() {

        <button class="pk-name" data-pkwords="${k.index}">${U.esc(k.label)}${k.learned ? (() => { const av = Math.max(1, Math.round(k.words.reduce((n, w) => n + Plan.wordStage(w), 0) / k.words.length)); return `<small class="pk-sit">${this.pips(av)} meist ${STAGES[av].de}</small>`; })() : ""}${k.done ? `<small class="pk-xp">Heute: ${this.reviewXP(setId, k.index).label}</small>` : ""}</button>
        ${k.done ? `<button class="pk-rep" data-reppack="${k.index}">🔁 Nochmal</button>` : `<span class="pk-n">${k.learned}/${k.words.length}</span>`}</div>`).join("")}

  pips(st) {

    return `<span class="pips" title="${st ? "Stufe " + st + " · " + STAGES[st].de : "noch nicht gelernt"}">${[1, 2, 3, 4, 5, 6].map(i => `<i style="${i <= st ? "background:" + c : ""}"></i>`).join("")}</span>`;
  },
  stageLabel(st) { return st ? `<span class="st-lbl" style="color:${STAGES[st].col}">${STAGES[st].de}</span>` : ""; },
  wordRow(w) {
    const m = Plan.stage(w, "m"), sp = w.sp ? Plan.stage(w, "s") : null, ws = Plan.wordStage(w);
    return `<div class="wl-row ${ws >= 6 ? "sits" : ""}"><div class="wl-w"><b>${U.esc(w.en)}</b><span>${U.esc(w.de)}</span></div>

  },
  setStages(setId) {
    const set = Data.set(setId), n = [0, 0, 0, 0, 0, 0, 0];
    set.words.forEach(w => n[Plan.wordStage(w)]++);

          ${due ? `<br>🔁 <b>Heute ${due === 1 ? "ist 1 Wort" : "sind " + due + " Wörter"} wieder dran.</b> Sie kommen beim Putzen, Trösten, Spielzeug-Erspielen und in neuen Päckchen.` : "<br>🔁 Heute ist kein Wort mehr dran – super!"}</p>

  /* Wörterliste nach Stufen: erst die Stufe, darunter ihre Wörter („sitzt!“ oben).
     Ein Wort steht in der Stufe seines schwächeren Teils; weichen Bedeutung und Schreiben ab, steht es klein dahinter. */
  openWordList(setId, packIndex, onlyStage) {
    const set = Data.set(setId), pack = packIndex != null ? Plan.packs(setId)[packIndex] : null;
    const words = pack ? pack.words : set.words, total = words.length;
    const by = [[], [], [], [], [], [], []];
    words.forEach(w => by[Plan.wordStage(w)].push(w));
    const learnedN = total - by[0].length;
    const title = pack ? U.esc(pack.label) : `${U.esc(set.title)} · Wörterliste`;
    const stages = onlyStage ? [onlyStage] : [6, 5, 4, 3, 2, 1];
    const item = w => { const m = Plan.stage(w, "m"), sp = w.sp ? Plan.stage(w, "s") : m;
      return `<div class="wl-row"><div class="wl-w"><b>${U.esc(w.en)}</b><span>${U.esc(w.de)}</span></div>${m !== sp ? `<div class="wl-st"><span>📖 ${m} · ✏️ ${sp}</span></div>` : ""}</div>`; };
    const groups = stages.filter(i => onlyStage || by[i].length).map(i => `<div class="wl-head st-h"><span><i style="background:${STAGES[i].col}"></i>Stufe ${i} · ${STAGES[i].de}</span><span>${by[i].length} ${by[i].length === 1 ? "Wort" : "Wörter"}</span></div>
      ${by[i].length ? by[i].map(item).join("") : `<div class="wl-row later"><div class="wl-w"><span>Hier ist gerade kein Wort.</span></div></div>`}`).join("");
    this.dialog(`<p class="dlg-title">${title}</p><p class="dlg-en">${learnedN} von ${total} Wörtern gelernt</p>
      <p class="small">Jedes Wort steht in der Stufe, die es gerade erreicht hat. Steht etwas wie „📖 5 · ✏️ 4“ dahinter, ist die Bedeutung schon weiter als das Schreiben.</p>
      <div class="wl">${groups || `<p class="small">Hier hast du noch keine Wörter gelernt.</p>`}
        ${!onlyStage && by[0].length ? `<div class="wl-head st-h"><span>✨ noch nicht gelernt</span><span>${by[0].length} ${by[0].length === 1 ? "Wort" : "Wörter"}</span></div>` : ""}</div>
      ${onlyStage ? `<button class="btn" data-allstages>Alle Stufen ansehen</button>` : ""}
      <button class="btn primary big" data-close>OK</button>`,
      d => { const a = d.querySelector("[data-allstages]"); if (a) a.onclick = () => this.openWordList(setId, packIndex); });
  },
  openRefresh(setId) {
    const words = Data.set(setId).words.filter(w => Plan.refreshSoon(w)).sort((a, b) => Plan.wordStage(a) - Plan.wordStage(b));
    this.dialog(`<p class="dlg-title">🔄 Wörter, die wir bald auffrischen</p>
      <p class="small">Diese Wörter sind noch frisch oder neulich mal danebengegangen. Sie kommen bald wieder dran – ganz von allein.</p>

  openExam(setId) {
    const set = Data.set(setId), pages = [...new Set(set.words.map(w => w.pg))].sort((a, b) => a - b);
    const opt = sel => pages.map(p => `<option value="${p}" ${p === sel ? "selected" : ""}>${p}</option>`).join("");
    const d = this.dialog(`<p class="dlg-title">📝 Fit für die Klassenarbeit</p><p class="dlg-en">${U.esc(set.title)} · alle Wörter gemischt</p>
      <p class="small">Wähle die Buchseiten, die in der Arbeit drankommen. Jede Runde hat 15 Wörter, die nächste Runde nimmt andere.</p>

      <p class="small" data-examcount></p>
      <button class="btn primary big" data-examgo>Los geht's!</button>
      <button class="btn ghost" data-close>Abbrechen</button>`);
    const f = d.querySelector("[data-from]"), t = d.querySelector("[data-to]"), c = d.querySelector("[data-examcount]"), go = d.querySelector("[data-examgo]");
    const upd = () => {
      let a = +f.value, b = +t.value; if (a > b) [a, b] = [b, a];
      const all = set.words.filter(w => w.pg >= a && w.pg <= b), l = all.filter(w => Plan.isLearned(w)).length;
      c.innerHTML = l ? `<b>${l} von ${all.length}</b> Wörtern aus diesem Bereich hast du schon gelernt. Heute: ${this.reviewXP(setId).label}.` : "Aus diesem Bereich hast du noch keine Wörter gelernt.";
      go.disabled = !l;
    };
    f.onchange = t.onchange = upd; upd();
    go.onclick = () => { let a = +f.value, b = +t.value; if (a > b) [a, b] = [b, a]; d.hidden = true; this.startExam(setId, a, b); };

      <label class="t-check"><input type="checkbox" data-spm ${Plan.spellMeaning() ? "checked" : ""}> Richtig geschrieben (mit deutschem Wort als Vorgabe) zählt auch für die Bedeutung. Das halbiert die nötigen Wiederholungen.</label>
      <p class="small">Die Abstände 1, 3, 7, 14 und 30 Tage sind Faustregeln aus der Praxis, nicht wissenschaftlich als ideal belegt. Belegt ist nur, dass verteiltes Wiederholen besser wirkt als Lernen am Stück. Änderungen gelten ab der nächsten Antwort.</p>

  },
  /* Passwort für Lehrkräfte: im Code steht nur ein Prüfwert, nicht das Passwort selbst */
  pwHash(str, seed = 7) { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); },
  teacherLock() {
    const d = this.dialog(`<p class="dlg-title">👩‍🏫 Nur für Lehrkräfte</p><p>Bitte das Passwort eingeben.</p>
      <input class="type-in" type="password" data-tans autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <p class="bk-err" data-terr></p>
      <button class="btn primary big" data-tgo>Öffnen</button><button class="btn ghost" data-close>Abbrechen</button>`);
    const inp = d.querySelector("[data-tans]");
    const go = () => { if (this.pwHash(inp.value.trim()) === TEACHER_PW) { this.teacher = true; d.hidden = true; this.render(true); } else { d.querySelector("[data-terr]").textContent = "Das Passwort stimmt leider nicht."; inp.value = ""; } };
    d.querySelector("[data-tgo]").onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
    setTimeout(() => inp.focus(), 50);
  },
  stageListDialog() {
    const t = U.today(), when = tr => !tr ? "–" : tr.due <= t ? "heute" : "in " + (tr.due - t) + " T.";
    const rows = Plan.learnedWords().map(w => { const m = Plan.track(w, "m"), sp = Plan.track(w, "s");
      return `<tr><td>${U.esc(w.en)}</td><td>${m.st} · ${when(m)}</td><td>${sp ? sp.st + " · " + when(sp) : "–"}</td></tr>`; }).join("");
    this.dialog(`<p class="dlg-title">📋 Lernstand</p><p class="small">Heute gezählt: ${Plan.countedToday()} · noch fällig: ${Plan.dueTracks().length}${Plan.clockBack() ? " · ⚠️ Uhr wurde zurückgestellt" : ""}</p>
      <div class="wl"><table class="st-table"><tr><th>Wort</th><th>📖</th><th>✏️</th></tr>${rows}</table></div>
      <button class="btn primary big" data-close>OK</button>`);
  },

  /* Zum Shop springen, direkt zur passenden Stelle (Futter oder Deko) */
  goShop(anchor) {
    this.view = "shop"; this.render();
    const el = document.getElementById(anchor); if (el) el.scrollIntoView({ block: "start" });
  },

  walletNote() { return `<div class="wallet-note">Du hast jetzt <b>⭐ ${this.A.wallet} XP</b> zum Einkaufen.</div>`; },

  dialog(html, after) {
    const d = document.querySelector(".dialog");
    d.hidden = false; d.dataset.rerender = ""; d.innerHTML = `<div class="dlg-box">${html}</div>`;
    const close = () => { d.hidden = true; d.innerHTML = ""; if (d.dataset.rerender || this.pendingZoo) this.render(true); };
    d.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
    d.onclick = e => { if (e.target === d) close(); };
    if (after) after(d);
    return d;
  },

  buy(food, btn) {
    const A = this.A, f = FOODS[food];
    if (A.wallet < f.price) return;
    A.wallet -= f.price; A.inv[food]++; Store.save();
    Sound.play("coin");
    this.render(true);
    const ico = document.querySelector(`.food-row [data-icon="${food}"]`);
    if (ico) ico.classList.add("pop");
  },
  practice(n, title, onDone, shopXP, encId, setId, packIndex) {
    // Aufgaben am Gehege erst nach dem ersten fertigen Päckchen (sonst gäbe es nur ein, zwei Wörter immer wieder)
    if (encId && this.donePacks() < 1) {
      document.querySelectorAll(".dialog").forEach(x => x.hidden = true);
      this.dialog(`${Mio.svg("encourage")}<p class="dlg-title">First, finish your first pack!</p><p class="dlg-en">Erst das erste Päckchen fertig lernen!</p>
        <p>Lerne im Shop dein erstes Päckchen fertig. Dann kannst du hier putzen, trösten und Spielzeug erspielen. Mio hilft dir bis dahin.</p>
        <button class="btn primary big" data-shop>Zum Shop</button><button class="btn ghost" data-close>Später</button>`,
        d => d.querySelector("[data-shop]").onclick = () => { this.view = "shop"; d.hidden = true; this.render(); });
      return;
    }
    const encXP = encId && this.hasFriend(encId) ? ENC_XP_TWO : ENC_XP_ONE;
    const opts = { xp: shopXP ? (typeof shopXP === "object" ? shopXP : null) : encXP, finishTitle: title, finishExtra: () => this.walletNote(), onClose: res => {
      if (res.completed) onDone();
      if (packIndex != null && res.completed && res.mistakes === 0) this.markPerfect(setId, packIndex);
      const m = res.completed ? this.afterMsg : null; this.afterMsg = null;
      if (encId) this.returnEnc = encId;                                // danach wieder ins Gehege, nicht zurück an den Anfang der Seite
      this.quiet = !!m; this.render(packIndex != null || !!encId); this.quiet = false;
      if (m) m();
    } };

  /* Punkt über dem Kopf eines Tiers (in % der Szene) */
  headSpot(id, pos) { const s = Pix.size(id); return [100 * (pos[0] + s.w / 2) / 64, 100 * (pos[1] + s.h * 0.25) / 44]; },
  heartsAt(sc, spot, n) {
    const hz = sc.querySelector(".hearts"); if (!hz) return;

      const h = Pix.icon("heart"); h.className = "px-icon heart";
      h.style.left = (spot[0] - 5 + Math.random() * 6) + "%"; h.style.top = (spot[1] - 6) + "%"; h.style.bottom = "auto";

    }

  /* Futter fliegt zum Tier (nur Anzeige – gespeichert ist schon alles) */
  flyFood(sc, food, spot, onDone) {
    const f = document.createElement("div"); f.className = "food-fly";
    f.style.setProperty("--x1", (spot[0] - 4) + "%"); f.style.setProperty("--y1", (spot[1] - 4) + "%");
    f.appendChild(Pix.icon(food)); sc.appendChild(f);
    f.addEventListener("animationend", e => { if (e.target !== f) return; f.remove(); if (sc.isConnected) onDone(); });
  },
  feed(a, d) {
    const A = this.A, x = A.animals[a.id], t = U.today();
    if (!(A.inv[a.food] > 0)) return;
    A.inv[a.food]--;
    // bei zwei Tieren: erst nach der zweiten Portion sind beide satt
    const n = (x.part && x.part.day === t ? x.part.n : 0) + 1;
    x.part = { day: t, n };
    const two = this.hasFriend(a.id), F = FRIENDS[a.id];
    const fb0 = d.querySelector("[data-feed]"); if (fb0) fb0.disabled = true;
    const sc0 = d.querySelector("[data-bigscene]");
    sc0.scrollIntoView({ block: "nearest", behavior: "smooth" });
    const spot1 = this.headSpot(a.id, a.pos), spot2 = two ? this.headSpot(a.id, F.pos) : null;
    if (n < this.portions(a.id)) {
      Store.save(); this.bump("fed");
      this.flyFood(sc0, a.food, spot1, () => {
        Sound.play("coin");
        this.openEnc(a.id);
        const d2 = document.querySelector(".dialog"); d2.dataset.rerender = "1";
        this.heartsAt(d2.querySelector("[data-bigscene]"), spot1, 4);
      });
      return;
    }
    x.fed = t; Store.save(); this.bump("fed");
    this.checkZoo();
    d.dataset.rerender = "1";
    this.flyFood(sc0, a.food, two ? spot2 : spot1, () => this.feedDone(a, d, spot1, spot2));
  },
  feedDone(a, d, spot1, spot2) {
    Sound.play("finish"); Confetti.burst(60);
    const sc = d.querySelector("[data-bigscene]");

    if (spot2) { this.heartsAt(sc, spot1, 4); this.heartsAt(sc, spot2, 4); this.hearts(sc, 4); }
    else { this.heartsAt(sc, spot1, 5); this.hearts(sc, 3); }
    this.toyRow(a, d);
    const fb = d.querySelector("[data-feed]");
    fb.outerHTML = `<div class="yum"><div class="yum-mio">${Mio.svg("cheer")}</div><div class="bubble">Yummy! ${this.hasFriend(a.id) ? "Jetzt sind beide satt." : a.der + " ist jetzt satt."}</div></div>`;

      : this.bi(a.der + " ist satt und glücklich 😊", this.enName(a) + " is full and happy.")}`;
    d.querySelector(".px-wrap").appendChild(Pix.icon(a.food));

  /* ---------- Tierbabys ---------- */
  hasBaby(id) { return !!(this.A.babies && this.A.babies[id] != null); },
  babyCount() { return Object.keys(this.A.babies || {}).length; },
  nextBaby() { return BABIES.find(b => !this.hasBaby(b.id) && this.A.unlocked.includes(b.id)); },
  babyWaiting(id) { return !this.hasBaby(id) && !!(this.A.babyWait && this.A.babyWait[id] != null); },
  markPerfect(setId, idx) { const A = this.A; A.perfectPacks = A.perfectPacks || {}; if (!A.perfectPacks[setId + ":" + idx]) { A.perfectPacks[setId + ":" + idx] = U.today(); Store.save(); } },
  babyStat(k) {
    if (k === "perfectPacks") return Object.keys(this.A.perfectPacks || {}).length;
    if (k === "almost") return Plan.almostCount();
    if (k === "solid") return Plan.solidCount();
    return this.stat(k);
  },
  babyProgress(b) {
    const w = Plan.learnedWords().length, g = this.babyStat(b.k), wOk = !b.words || w >= b.words;
    const r = b.alt ? Plan.reviewsDone() : 0, gOk = g >= b.n || (b.alt && r >= b.alt);
    return { w, g, r, wOk, gOk, ok: wOk && gOk };
  },
  babyGoalText(b) {
    const p = this.babyProgress(b);
    return (b.words ? `${p.wOk ? "✅" : "📚"} Wörter ${Math.min(p.w, b.words)}/${b.words} · ` : "") + `${p.gOk ? "✅" : "⏳"} ${BABY_GOALS[b.k].de(b.n)} (${Math.min(p.g, b.n)}/${b.n})`
      + (b.alt && !p.gOk ? ` · oder 💪 ${b.alt} Wiederholungen (${Math.min(p.r, b.alt)}/${b.alt})` : "");
  },
  /* Ziel erreicht -> mit zwei Tieren im Gehege kommt das Baby sofort, sonst wartet es (verdient bleibt verdient) */
  checkBabies() {
    const A = this.A; A.babyWait = A.babyWait || {}; A.babyWaitNew = A.babyWaitNew || [];
    let changed = false;
    BABIES.forEach(b => {
      if (this.hasBaby(b.id) || !A.unlocked.includes(b.id)) return;
      if (A.babyWait[b.id] == null && !this.babyProgress(b).ok) return;
      if (this.hasFriend(b.id)) { A.babies[b.id] = U.today(); delete A.babyWait[b.id]; A.babyQueue.push(b.id); changed = true; }
      else if (A.babyWait[b.id] == null) { A.babyWait[b.id] = U.today(); A.babyWaitNew.push(b.id); changed = true; }
    });
    if (changed) Store.save();
  },
  babyWaitPopup() {
    const id = this.A.babyWaitNew.shift(); Store.save();
    const b = BABIES.find(x => x.id === id), a = this.animal(id); if (!b || this.hasBaby(id)) return;

      <p>Du hast es dir verdient! Ein Baby braucht aber Mama und Papa: Das ${b.name} kommt, sobald im ${a.geh}-Gehege ${FRIENDS[id].ein} wohnt.</p>
      <button class="btn primary big" data-tofriend>Zu den neuen Freunden</button><button class="btn ghost" data-close>Später</button>`,
      d => { d.dataset.rerender = "1"; d.querySelector("[data-tofriend]").onclick = () => { d.hidden = true; this.goShop("shop-friends"); }; });
  },
  babyPopup() {
    const id = this.A.babyQueue.shift(); Store.save();
    const b = BABIES.find(x => x.id === id), a = this.animal(id); if (!b) return;
    Sound.play("finish"); Confetti.burst(170, "hearts");
    const word = b.hatch ? "geschlüpft" : "geboren", enWord = b.hatch ? "has hatched" : "has been born";
    this.dialog(`<p class="dlg-title">🍼 A ${b.en} ${enWord}!</p><p class="dlg-en">Ein ${b.name} ist ${word}!</p>
      <div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p>${b.k === "almost" || b.k === "solid" ? "Weil deine Wörter schon so gut sitzen" : "Weil du so fleißig neue Wörter lernst und dich gut um deinen Zoo kümmerst"}, wohnt jetzt ein ${b.name} im ${a.geh}-Gehege. Es läuft immer hinter ${id === "owl" ? "seiner Mama" : "den Großen"} her und braucht kein eigenes Futter.</p>
      <button class="btn primary big" data-close>Willkommen, Kleines!</button>`,
      d => { this.scene(d.querySelector("[data-bigscene]"), a, true); d.dataset.rerender = "1"; });
  },
  /* Baby im Gehege: folgt den Eltern (Routine), sitzt still daneben oder – bei der Eule – auf seinem Baumstumpf */
  babyFollow(id, f, xy, flip) {
    const s = Pix.size(f), bs = Pix.size(id + "_baby");
    const tailRight = id === "seal" ? !!flip : !flip;
    let x = tailRight ? xy[0] + s.w - 3 : xy[0] - bs.w + 3;
    if (id === "giraffe") x = flip ? xy[0] + s.w - bs.w - 3 : xy[0] + 3;   // läuft zwischen Mamas Beinen
    x = Math.max(1, Math.min(63 - bs.w, x));
    return [x, Math.max(0, xy[1] + s.h - bs.h + 1)];
  },
  babyRoutine(id, segs) {
    let last = null;
    const bf = id + "_baby";
    return segs.map(sg => {
      if (!sg.f.startsWith(id)) return { f: bf, a: last || this.babyFollow(id, id, this.animal(id).pos, false), t: sg.t, flip: sg.flip };
      const a = this.babyFollow(id, sg.f, sg.a, sg.flip), b = sg.b ? this.babyFollow(id, sg.f, sg.b, sg.flip) : null;
      last = b || a;
      return { f: bf, a, b, t: sg.t, flip: sg.flip };
    });
  },
  paintBaby(el, a, segs, key, pos, once) {
    if (!this.hasBaby(a.id)) return;
    const cls = "baby baby-" + a.id;
    if (a.id === "owl") {
      el.appendChild(Pix.el("stump", "toy", 26, 30, 64, 44));
      el.appendChild(Pix.el("owl_baby", cls, 27, 22, 64, 44));
      return;
    }
    if (segs) Routine.mount(el, "baby_" + key, this.babyRoutine(a.id, segs), { once, delay: once ? 0 : 0.97, frameClass: cls });
    else { const p = this.babyFollow(a.id, a.id, pos, false); el.appendChild(Pix.el(a.id + "_baby", cls, p[0], p[1], 64, 44)); }
  },

  /* ---------- Zoo-Eingang ---------- */
  gateItems() { return TROPHIES.filter(t => (this.A.trophies || {})[t.id]).length + this.babyCount(); },
  gateNeed(st) { return st.need === 999 ? TROPHIES.length + BABIES.length : st.need; },
  gateBudget() { const n = this.gateItems(); return GATE_STEPS.filter(st => this.gateNeed(st) <= n).length; },
  gateTotal() { return GATE_STEPS.length; },
  gateCount() { return Math.min(this.gateTotal(), this.A.gateShown || 0); },
  gateHas(id) { return GATE_STEPS.findIndex(x => x.id === id) < this.gateCount(); },
  gateNext() { return GATE_STEPS[this.gateCount()] || null; },
  /* höchstens ein neues Teil auf einmal (am Anfang zwei pro Tag, danach eins pro Tag) */
  advanceGate() {
    const A = this.A, t = U.today();
    if (A.gateDay !== t) { A.gateDay = t; A.gateDayN = 0; }
    const cap = A.gateShown < GATE_FAST ? 2 : 1;
    if (this.gateBudget() > A.gateShown && A.gateDayN < cap) {
      A.gateQueue.push(GATE_STEPS[A.gateShown].id); A.gateShown++; A.gateDayN++; Store.save();
    }
  },
  gatePopup() {
    const id = this.A.gateQueue.shift(); Store.save();
    const st = GATE_STEPS.find(x => x.id === id); if (!st) return;
    Sound.play("coin"); Confetti.burst(90, "stars");
    this.dialog(`<p class="dlg-title">🏛️ New at the zoo entrance!</p><p class="dlg-en">Neu am Zoo-Eingang</p>
      <div class="enc-big"><div class="scene big gate-scene" data-bigscene></div></div>
      <p>Am Eingang gibt es jetzt <b>${st.name}</b>.</p>
      <button class="btn primary big" data-close>Super!</button>`,
      d => { this.gateScene(d.querySelector("[data-bigscene]"), true); d.dataset.rerender = "1"; });
  },
  possessive(n) { return /[sßxz]$/i.test(n) ? n + "'" : n + "s"; },
  zooTitle() { const n = this.A.kidName; return n ? `Mios & ${this.possessive(n)} Zoo` : "Mios Zoo"; },
  gateScene(el, big) {
    el.innerHTML = "";
    const L = this.look(), has = id => this.gateHas(id);
    const bg = document.createElement("canvas"); bg.className = "bg"; GateScene.draw(bg, has, L); el.appendChild(bg);
    // gekaufte Saison-Deko
    this.seasonDecos().forEach(item => {
      if (!this.hasDeco(item.id, "gate")) return;
      if (item.slot === "fence") return this.paintGateLights(el);
      const pos = GATE_DECO_POS[item.id]; if (!pos) return;
      const v = this.decoVariant(item, "gate");
      if (v.frames) return this.paintFlicker(el, v, pos, 128, 64, "deco deco-" + item.id);
      el.appendChild(Pix.elVar(v.name, v.map, v.outline, "deco deco-" + item.id, pos[0], pos[1], 128, 64));
    });
    // Schild mit Namen
    const P = GateScene.plaque(has), sign = document.createElement("div");
    sign.className = "gate-sign" + (has("gold") ? " gold" : "");
    sign.style.left = (100 * P.x / 128) + "%"; sign.style.top = (100 * P.y / 64) + "%";
    sign.style.width = (100 * P.w / 128) + "%"; sign.style.height = (100 * P.h / 64) + "%";
    sign.textContent = this.zooTitle().toUpperCase();
    el.appendChild(sign);
    this.paintWeather(el, big);
    // Schrift passend zur Schildbreite (sofort, ohne Verzögerung)
    let fs = el.clientWidth * (P.h * 0.85) / 128;
    sign.style.fontSize = fs + "px";
    while (fs > 4 && sign.scrollWidth > sign.clientWidth + 1) { fs -= 0.5; sign.style.fontSize = fs + "px"; }
  },
  paintGateLights(el) {
    [0, 1].forEach(grp => {
      const c = document.createElement("canvas"); c.width = 128; c.height = 64; c.className = "bg lights l" + grp;
      const g = c.getContext("2d");
      let k = 0;
      for (let x = 1; x < 128; x += 3) { if (x > 44 && x < 84) continue; k++; if (k % 2 !== grp) continue; g.fillStyle = DECO_COLORS[k % DECO_COLORS.length]; g.fillRect(x, this.gateHas("stone") ? 18 : 17, 1, 2); }
      el.appendChild(c);
    });
  },
  openGate() {
    const A = this.A, c = this.gateCount(), T = this.gateTotal(), nx = this.gateNext();
    const left = nx ? Math.max(0, this.gateNeed(nx) - this.gateItems()) : 0;
    const canName = this.babyCount() >= 1;
    const items = this.seasonDecos();
    const dc = items.filter(it => this.hasDeco(it.id, "gate")).length;
    this.dialog(`<div class="enc-big"><div class="scene big gate-scene" data-bigscene></div></div>
      <p class="dlg-title">Zoo entrance</p><p class="dlg-en">${U.esc(this.zooTitle())}</p>
      <div class="row"><div class="row-txt">🏛️ ${c} von ${T} Teilen. Pokale und Tierbabys bringen neue Teile – immer eins nach dem anderen.</div>
        ${!nx ? `<p class="small">🎉 Dein Eingang ist komplett!</p>`
          : left === 0 ? `<p class="small">Als Nächstes: <b>${nx.name}</b> – kommt morgen! 🌙</p>`
          : `<p class="small">Als Nächstes: <b>${nx.name}</b> – noch ${left} ${left === 1 ? "Pokal oder Baby" : "Pokale oder Babys"}.</p>`}</div>
      <div class="row"><div class="row-txt">✏️ Dein Name auf dem Schild</div>
        ${canName ? `<div class="name-row"><input class="type-in name-in" maxlength="12" value="${U.esc(A.kidName || "")}" placeholder="Dein Name" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="btn primary" data-savename>Speichern</button></div>
          <p class="small">Der Name bleibt nur auf diesem Handy. Ein Spitzname geht auch.</p>`
        : `<p class="small">🔒 Sobald dein erstes Tierbaby da ist, darfst du deinen Namen aufs Schild schreiben: „Mios & …s Zoo“.</p>`}</div>
      ${items.length ? `<div class="row"><div class="row-txt">🎨 ${this.season().name}-Deko am Eingang: ${dc} von ${items.length}</div>
        ${dc < items.length ? this.bbtn("data-todeco", "Im Shop schmücken", "Decorate in the shop", "") : ""}</div>` : ""}
      <button class="btn ghost bi-btn" data-close><span>Close</span><em class="en">Schließen</em></button>`,
      d => {
        this.gateScene(d.querySelector("[data-bigscene]"), true);
        const sv = d.querySelector("[data-savename]");
        if (sv) sv.onclick = () => {
          const v = d.querySelector(".name-in").value.replace(/[^A-Za-zÄÖÜäöüßÀ-ÿ \-]/g, "").replace(/\s+/g, " ").trim().slice(0, 12);
          A.kidName = v || null; Store.save(); Sound.play("coin");
          d.hidden = true; this.render(true); this.openGate();
        };
        const td = d.querySelector("[data-todeco]");
        if (td) td.onclick = () => { d.hidden = true; this.goShop("shop-deco"); };
      });
  },

  zooParty() {
    const lvl = this.pendingZoo; this.pendingZoo = null;
    Sound.play("finish"); Confetti.burst(200);
    const power = lvl === 2;
    this.dialog(`<div class="party-mio">${Mio.svg("party")}</div>
      <p class="dlg-title">${power ? "💖 POWER ZOO! 💖" : "❤️ Happy Zoo! ❤️"}</p>
      <p>${power ? "Alle Tiere sind superglücklich!" : "Alle Tiere sind gefüttert und alle Gehege sind sauber!"}</p>
      <p><b>${power ? `Power-Serie: ⚡ ${this.zooStreak(2)}` : `Serie: 🔥 ${this.zooStreak(1)}`} ${this.zooStreak(power ? 2 : 1) === 1 ? "Tag" : "Tage"}</b><br>Bonus: +${power ? ZOO.POWER_BONUS : ZOO.HAPPY_BONUS} XP</p>
      ${power ? "" : `<p class="small">Erspiel jetzt am Gehege jedem Tier sein Spielzeug – dann wird es ein Power-Zoo 💖.</p>`}
      <button class="btn primary big" data-close>Juhu!</button>`, d => { d.dataset.rerender = "1"; });
  },

  celebrate(a, en, de) {
    Sound.play("combo"); Confetti.burst(90);
    this.dialog(`<div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p class="dlg-title">${U.esc(en)}</p><p>${U.esc(de)}</p><button class="btn primary big" data-close>Super!</button>`,
      d => { this.scene(d.querySelector("[data-bigscene]"), a, true); d.dataset.rerender = "1"; });
  },

  lockedRow() {
    return `<div class="food-row locked-row"><span class="food-ico lock-ico">🔒</span>
      <div class="food-txt"><b>Bald neu</b><span>kommt mit einem neuen Tier</span></div></div>`;
  },
  friendPrice(id) {
    if (FRIENDS[id].price) return FRIENDS[id].price;
    return FRIEND_PRICE + FRIEND_STEP * ANIMALS.filter(a => !FRIENDS[a.id].price && this.hasFriend(a.id)).length;
  },
  buyFriend(id) {
    const A = this.A, price = this.friendPrice(id);
    if (A.wallet < price || !A.unlocked.includes(id) || this.hasFriend(id)) return;
    A.wallet -= price; A.animals[id].friend = true;
    // falls heute schon gefüttert: der Neue hat auch gegessen (keine Strafe beim Kauf)
    A.friendWelcome = (A.friendWelcome || []).concat(id);
    Store.save(); this.bump("friends");
    Sound.play("coin");
    this.render(true);
  },
  friendPopup() {
    const id = this.A.friendWelcome.shift(); Store.save();
    const a = this.animal(id);
    Sound.play("finish"); Confetti.burst(150, "hearts");
    this.dialog(`<p class="dlg-title">💕 Neuer Freund!</p><div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p>Im ${a.geh}-Gehege wohnt jetzt ${FRIENDS[id].ein}!${id === "owl" ? " Sie bekommt ihre eigene Sitzstange." : ""}</p>
      <p class="small">${this.hunger(id) === 0 ? "Ab morgen" : "Ab jetzt"} braucht das Gehege 2 Portionen ${FOODS[a.food].name} am Tag. Das Spielzeug teilen sich beide.</p>
      <button class="btn primary big" data-close>Willkommen!</button>`,
      d => { this.scene(d.querySelector("[data-bigscene]"), a, true); d.dataset.rerender = "1"; });
  },
  welcomeAnimal() {
    const id = this.A.welcome.shift(); Store.save();
    const a = this.animal(id);
    Sound.play("finish"); Confetti.burst(150);
    this.dialog(`<p class="dlg-title">🎉 Neues Tier!</p><div class="enc-big"><div class="scene big" data-bigscene></div></div>
      <p>${a.need ? `🦁 Der König der Tiere! ${Plan.solidCount() >= a.needN ? `Weil schon ${a.needN} Wörter richtig sitzen` : `Weil du so fleißig wiederholt hast`}, zieht ${a.der.replace(/^D/, "d")} in deinen Zoo ein!` : `${a.der} zieht in deinen Zoo ein!`} ${a.er} frisst gern <b>${FOODS[a.food].name}</b>.</p>
      <button class="btn primary big" data-close>Willkommen!</button>`,
      d => { this.scene(d.querySelector("[data-bigscene]"), a, true); d.dataset.rerender = "1"; });
  },

  /* Nur zum Testen */
  skipDay() {
    const d = Store.data, A = this.A;
    Object.values(d.words).forEach(s => { s.due -= 1;
      if (s.t) { s.t.m.due -= 1; if (s.t.s) s.t.s.due -= 1; }
      if (s.ref != null) s.ref -= 1; if (s.sat != null) s.sat -= 1; });
    if (d.maxDay != null) d.maxDay -= 1;
    if (d.dueCount) d.dueCount.day -= 1;
    if (d.examSeen) d.examSeen.day -= 1;
    Object.keys(A.babyWait || {}).forEach(k => A.babyWait[k] -= 1);
    if (d.lastLessonDay != null) d.lastLessonDay -= 1;
    if (d.lastPlayDay != null) d.lastPlayDay -= 1;
    const pd = {}; Object.keys(d.packsDone).forEach(k => pd[+k - 1] = d.packsDone[k]); d.packsDone = pd;
    Object.values(A.animals).forEach(x => { x.fed -= 1; x.clean -= 1; if (x.toy != null) x.toy -= 1; if (x.comforted != null) x.comforted -= 1; });
    if (A.lastVisit != null) A.lastVisit -= 1;
    const zd = {}; Object.keys(A.days || {}).forEach(k => zd[+k - 1] = A.days[k]); A.days = zd;
    const xd = {}; Object.keys(A.xpDays || {}).forEach(k => xd[+k - 1] = A.xpDays[k]); A.xpDays = xd;
    if (A.lastEventRoll != null) A.lastEventRoll -= 1;
    if (A.event) A.event.day -= 1;
    if (A.revRounds) A.revRounds.day -= 1;
    Object.keys(A.packLearned || {}).forEach(k => A.packLearned[k] -= 1);
    Object.keys(A.babies || {}).forEach(k => A.babies[k] -= 1);
    if (A.gateDay != null) A.gateDay -= 1;
    Store.save();
    this.rollEvent();
  }
};

App.init();

</script>
</body>
</html>
